<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-purple: #a855f7;
            --phosphor-glow: rgba(168, 85, 247, 0.2);
            --phosphor-green: #00ffa3;
            --text-primary: #ffffff;
            --text-muted: #555555;
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-display {
            position: relative;
            width: 516px;
            height: 336px;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Hintergrund-Textur (Grain) */
        .obsidian-display::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.05;
            pointer-events: none;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--phosphor-purple);
            font-weight: 800;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .label::after {
            content: '';
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--border-subtle), transparent);
        }

        .rule-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .rule-item {
            position: relative;
        }

        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 8px;
        }

        .rule-name {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .win-rate {
            color: var(--phosphor-green);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--phosphor-green);
            box-shadow: 0 0 12px rgba(0, 255, 163, 0.2);
            border-radius: 10px;
        }

        .stats-footer {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 600;
        }

        .edge-highlight {
            margin-top: 24px;
            padding: 12px;
            background: rgba(0, 255, 163, 0.03);
            border: 1px solid rgba(0, 255, 163, 0.1);
            border-radius: 16px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .edge-text {
            font-size: 0.7rem;
            line-height: 1.4;
            color: #d1d5db;
        }
    </style>
</head>
<body>

    <div class="obsidian-display">
        <div class="label">
            <span class="material-symbols-outlined" style="font-size: 16px;">menu_book</span>
            Playbook Efficiency
        </div>

        <div class="rule-container">
            <div class="rule-item">
                <div class="rule-header">
                    <span class="rule-name">Support Bounce</span>
                    <span class="win-rate">100% WR</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 100%;"></div>
                </div>
                <div class="stats-footer">Applied in 5 trades</div>
            </div>

            <div class="rule-item">
                <div class="rule-header">
                    <span class="rule-name">Trend Alignment</span>
                    <span class="win-rate">83.3% WR</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 83.3%;"></div>
                </div>
                <div class="stats-footer">Applied in 6 trades</div>
            </div>
        </div>

        <div class="edge-highlight">
            <span class="material-symbols-outlined" style="color: var(--phosphor-green); font-size: 18px;">bolt</span>
            <div class="edge-text">
                <strong style="color: var(--phosphor-green); display: block; margin-bottom: 2px;">STRATEGY EDGE FOUND</strong>
                Your highest probability setup is "Support Bounce". Consider increasing position size by 25% when this rule is met.
            </div>
        </div>
    </div>

</body>
</html>
