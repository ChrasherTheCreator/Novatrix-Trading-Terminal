<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-purple: #a855f7;
            --phosphor-glow: rgba(168, 85, 247, 0.2);
            --profit-max: #00ffa3;
            --profit-mid: #064e3b;
            --loss-max: #ff3366;
            --loss-mid: #4c0519;
            --text-muted: #555555;
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--obsidian-base);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Ambient Glow Background */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--phosphor-glow) 0%, transparent 70%);
            top: -150px;
            right: -150px;
            z-index: -1;
            filter: blur(80px);
        }

        .obsidian-display {
            position: relative;
            width: 782px;
            height: 512px;
            margin: 0;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Glass Reflection */
        .dashboard-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 100px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        .header-title h1 {
            font-size: 1.5rem;
            letter-spacing: -0.01em;
            color: var(--phosphor-purple);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header-title p {
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .stats-summary {
            display: flex;
            gap: 32px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
            margin-bottom: 4px;
            margin-top: 0;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
        }

        .stat-value.purple {
            color: var(--phosphor-purple);
            text-shadow: 0 0 10px var(--phosphor-glow);
        }

        .heatmap-wrapper {
            display: grid;
            grid-template-columns: 40px max-content;
            gap: 16px;
            position: relative;
            z-index: 2;
            flex: 1;
            align-items: center;
            justify-content: center;
        }

        .y-axis {
            display: grid;
            grid-template-rows: repeat(7, 23px);
            gap: 4px;
            width: 40px;
            flex-shrink: 0;
            font-size: 10px;
            color: var(--text-muted);
            align-items: center;
        }

        .heatmap-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .x-axis {
            display: grid;
            grid-template-columns: repeat(24, 23px);
            gap: 4px;
            width: max-content;
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 6px;
        }

        .grid-main {
            display: grid;
            grid-template-columns: repeat(24, 23px);
            grid-template-rows: repeat(7, 23px);
            gap: 4px;
            width: max-content;
            flex-shrink: 0;
        }

        /* Cell Styling */
        .cell {
            width: 23px;
            height: 23px;
            min-width: 23px;
            min-height: 23px;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s cubic-bezier(0.2, 1, 0.3, 1);
            cursor: crosshair;
            position: relative;
            flex-shrink: 0;
        }

        .cell:hover {
            transform: scale(1.4);
            z-index: 10;
            box-shadow: 0 0px 15px rgba(0,0,0,0.5);
            outline: 1px solid var(--phosphor-purple);
        }

        /* Data Colors */
        .p-4 { background: var(--profit-max); box-shadow: 0 0 10px rgba(0, 255, 163, 0.3); }
        .p-3 { background: #059669; }
        .p-2 { background: #065f46; }
        .p-1 { background: #064e3b; }
        .neutral { background: rgba(255,255,255,0.05); }
        .l-1 { background: #4c0519; }
        .l-2 { background: #881337; }
        .l-3 { background: #be123c; }
        .l-4 { background: var(--loss-max); box-shadow: 0 0 10px rgba(255, 51, 102, 0.3); }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: #000;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            border: 1px solid var(--phosphor-purple);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            white-space: nowrap;
            z-index: 100;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%);
        }

        .cell:hover .tooltip { opacity: 1; }

        .legend {
            margin-top: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            color: var(--text-muted);
        }

        .legend-gradient { display: flex; gap: 4px; }
        .legend-cell { width: 12px; height: 12px; border-radius: 2px; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cellFade {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="obsidian-display">
        <div class="header">
            <div class="header-title">
                <h1>Temporal P&L Distribution</h1>
                <p>Performance Heatmap</p>
            </div>
            <div class="legend">
            <span>Loss</span>
            <div class="legend-gradient">
                <div class="legend-cell l-4"></div>
                <div class="legend-cell l-3"></div>
                <div class="legend-cell l-2"></div>
                <div class="legend-cell neutral"></div>
                <div class="legend-cell p-2"></div>
                <div class="legend-cell p-3"></div>
                <div class="legend-cell p-4"></div>
            </div>
            <span>Profit</span>
        </div>
        </div>

        <div class="heatmap-wrapper">
            <div class="y-axis">
                <div>MON</div>
                <div>TUE</div>
                <div>WED</div>
                <div>THU</div>
                <div>FRI</div>
                <div>SAT</div>
                <div>SUN</div>
            </div>
            <div class="heatmap-content">
                <div class="x-axis" id="x-axis"></div>
                <div class="grid-main" id="grid"></div>
            </div>
        </div>

        <div class="stats-summary" style="margin-top: 24px;">
                <div class="stat-item">
                    <div class="stat-label">Peak Performance</div>
                    <div class="stat-value purple">Wed 14:00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Avg Hourly Delta</div>
                    <div class="stat-value">+$1,240.42</div>
                </div>
            </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const xAxis = document.getElementById('x-axis');
        const days = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];

        // Generate X-Axis Labels
        for(let i=0; i<24; i++) {
            const hour = document.createElement('div');
            hour.textContent = i.toString().padStart(2, '0');
            xAxis.appendChild(hour);
        }

        // Generate Cells
        for (let d = 0; d < 7; d++) {
            for (let h = 0; h < 24; h++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                // Deterministic Math for visual pattern
                const val = Math.sin(d * 0.5) * Math.cos(h * 0.2) + (Math.random() * 0.2);
                let colorClass, amount;

                if (val > 0.6) { colorClass = 'p-4'; amount = (val * 5000).toFixed(2); }
                else if (val > 0.3) { colorClass = 'p-3'; amount = (val * 3000).toFixed(2); }
                else if (val > 0.1) { colorClass = 'p-2'; amount = (val * 1500).toFixed(2); }
                else if (val > 0.05) { colorClass = 'p-1'; amount = (val * 500).toFixed(2); }
                else if (val > -0.05) { colorClass = 'neutral'; amount = "0.00"; }
                else if (val > -0.3) { colorClass = 'l-2'; amount = (val * 1500).toFixed(2); }
                else { colorClass = 'l-4'; amount = (val * 5000).toFixed(2); }

                cell.classList.add(colorClass);
                
                // Tooltip
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';
                tooltip.innerHTML = `<strong>${days[d]} ${h}:00</strong><br/>${val > 0 ? '+' : ''}$${amount}`;
                cell.appendChild(tooltip);
                
                // Staggered Animation
                cell.style.animation = `cellFade 0.6s ease forwards ${ (d * 24 + h) * 0.003 }s`;
                cell.style.opacity = '0';
                
                grid.appendChild(cell);
            }
        }
    </script>
</body>
</html>
