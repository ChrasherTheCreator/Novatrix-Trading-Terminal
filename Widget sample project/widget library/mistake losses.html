<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-purple: #a855f7;
            --phosphor-red: #ff3366;
            --text-primary: #ffffff;
            --text-muted: #555555;
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-display {
            position: relative;
            width: 516px;
            height: 336px;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--phosphor-purple);
            font-weight: 800;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .label::after {
            content: '';
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--border-subtle), transparent);
        }

        .mistake-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .mistake-card {
            position: relative;
        }

        .mistake-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .mistake-name {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .mistake-value {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        .percentage-tag {
            font-size: 0.7rem;
            color: var(--phosphor-red);
            font-weight: 800;
            background: rgba(255, 51, 102, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .progress-bg {
            height: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 2px;
        }

        .progress-fill {
            height: 100%;
            background: var(--phosphor-red);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="obsidian-display">
        <div class="label">
            <span class="material-symbols-outlined" style="font-size: 16px;">error</span>
            Mistake Analysis
        </div>

        <div class="mistake-list">
            <div class="mistake-card">
                <div class="mistake-info">
                    <div>
                        <div class="mistake-name">FOMO</div>
                        <div class="mistake-value">-$1,424</div>
                    </div>
                    <span class="percentage-tag">71.2%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" style="width: 71.2%;"></div>
                </div>
            </div>

            <div class="mistake-card">
                <div class="mistake-info">
                    <div>
                        <div class="mistake-name">Revenge Trading</div>
                        <div class="mistake-value">-$500</div>
                    </div>
                    <span class="percentage-tag">25.0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" style="width: 25%;"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
