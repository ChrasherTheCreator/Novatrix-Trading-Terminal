<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-purple: #a855f7;
            --phosphor-green: #00ffa3;
            --phosphor-red: #ff3366;
            --text-muted: #555555;
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .obsidian-display {
            position: relative;
            width: 516px;
            height: 336px;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--phosphor-purple);
            font-weight: 800;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .label::after {
            content: '';
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--border-subtle), transparent);
        }

        /* Asset Rows */
        .asset-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .asset-row {
            display: grid;
            grid-template-columns: 80px 1fr 60px;
            align-items: center;
            gap: 15px;
        }

        .asset-name {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
        }

        /* Progress Bar Container */
        .bar-container {
            height: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--phosphor-purple);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            border-radius: 3px;
            transition: width 1s ease-out;
        }

        /* Profit Factor Badge */
        .pf-badge {
            font-size: 10px;
            font-weight: 800;
            text-align: right;
        }

        .pf-high { color: var(--phosphor-green); text-shadow: 0 0 8px rgba(0, 255, 163, 0.3); }
        .pf-low { color: var(--phosphor-red); text-shadow: 0 0 8px rgba(255, 51, 102, 0.3); }
        .pf-mid { color: #fff; }

        .stat-header {
            display: grid;
            grid-template-columns: 80px 1fr 60px;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 8px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .footer-insight {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border-subtle);
            font-size: 10px;
            color: #888;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="obsidian-display">
        <div class="label">
            <span class="material-symbols-outlined" style="font-size: 16px;">category</span>
            Asset Performance
        </div>

        <div class="stat-header">
            <span>Asset</span>
            <span>Win Rate</span>
            <span style="text-align: right;">Profit Factor</span>
        </div>

        <div class="asset-list">
            <div class="asset-row">
                <span class="asset-name">BTC/USD</span>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 68%;"></div>
                </div>
                <span class="pf-badge pf-high">2.42</span>
            </div>

            <div class="asset-row">
                <span class="asset-name">XAU/USD</span>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 52%;"></div>
                </div>
                <span class="pf-badge pf-mid">1.85</span>
            </div>

            <div class="asset-row">
                <span class="asset-name">EUR/USD</span>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 38%;"></div>
                </div>
                <span class="pf-badge pf-low">0.92</span>
            </div>

            <div class="asset-row">
                <span class="asset-name">NAS100</span>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 61%;"></div>
                </div>
                <span class="pf-badge pf-high">2.15</span>
            </div>
        </div>

        <div class="footer-insight">
            <strong>FOCUS INSIGHT:</strong><br>
            Your performance on <strong>EUR/USD</strong> is dragging down your expectancy. Consider focusing on <strong>BTC</strong> and <strong>NASDAQ</strong> for better edge.
        </div>
    </div>

</body>
</html>
