<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-purple: #a855f7;
            --phosphor-green: #00ffa3;
            --phosphor-red: #ff3366;
            --text-muted: #555555;
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .obsidian-display {
            position: relative;
            width: 516px;
            height: 336px;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: none !important;
            box-shadow: none !important;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--phosphor-purple);
            font-weight: 800;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .label::after {
            content: '';
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--border-subtle), transparent);
        }

        /* Asset Rows */
        .asset-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .asset-row {
            display: grid;
            grid-template-columns: 80px 1fr 60px;
            align-items: center;
            gap: 15px;
        }

        .asset-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-primary, #ffffff);
            letter-spacing: 0.05em;
        }

        /* Progress Bar Container */
        .bar-container {
            height: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--phosphor-purple);
            box-shadow: none !important;
            border-radius: 3px;
            transition: width 1s ease-out;
        }

        /* Profit Factor Badge */
        .pf-badge {
            font-size: 10px;
            font-weight: 800;
            text-align: right;
        }

        .pf-high { color: var(--phosphor-green); text-shadow: 0 0 8px rgba(0, 255, 163, 0.3); }
        .pf-low { color: var(--phosphor-red); text-shadow: 0 0 8px rgba(255, 51, 102, 0.3); }
        .pf-mid { color: var(--text-primary, #ffffff); }

        .stat-header {
            display: grid;
            grid-template-columns: 80px 1fr 60px;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 8px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .footer-insight {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border-subtle);
            font-size: 10px;
            color: #888;
            line-height: 1.4;
        }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }

        /* Automatic Light Mode styling */
        .light-mode {
            --obsidian-base: #f8fafc;
            --obsidian-surface: #ffffff;
            --text-primary: #020617;
            --text-main: #020617;
            --text-dim: #64748b;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-subtle: rgba(139, 92, 246, 0.15);
            --surface-shine: rgba(0, 0, 0, 0.02);
            --grid-line: rgba(139, 92, 246, 0.08);
            --glow-accent: rgba(139, 92, 246, 0.05);
            --phosphor-green: #059669;
            --phosphor-red: #dc2626;
            --phosphor-glow-green: rgba(5, 150, 105, 0.1);
            --phosphor-glow-red: rgba(220, 38, 38, 0.1);
            --gloss-purple: #7c3aed;
        }
        .light-mode body {
            color: var(--text-primary) !important;
        }
        .light-mode .obsidian-display,
        .light-mode .creatix-card,
        .light-mode .card,
        .light-mode .widget-container,
        .light-mode .display-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        .light-mode svg text {
            fill: var(--text-dim) !important;
        }
        .light-mode .timeframe {
            color: var(--text-muted) !important;
        }
        .light-mode .label {
            color: var(--gloss-purple) !important;
        }
        .light-mode .stat-value.purple {
            color: var(--gloss-purple) !important;
        }
</style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>
<body>

    <div class="obsidian-display">
        <div class="insufficient-data-overlay" id="noDataOverlay">
            <span>NEEDS MORE DATA</span>
            <p>Add trades to see stats</p>
        </div>

        <div class="label">
            <span class="material-symbols-outlined" style="font-size: 16px;">category</span>
            Asset Performance
        </div>

        <div class="stat-header">
            <span>Asset</span>
            <span>Win Rate</span>
            <span style="text-align: right;">Profit Factor</span>
        </div>

        <div class="asset-list">
            <div class="asset-row">
                <span class="asset-name">BTC/USD</span>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 68%;"></div>
                </div>
                <span class="pf-badge pf-high">2.42</span>
            </div>

            <div class="asset-row">
                <span class="asset-name">XAU/USD</span>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 52%;"></div>
                </div>
                <span class="pf-badge pf-mid">1.85</span>
            </div>

            <div class="asset-row">
                <span class="asset-name">EUR/USD</span>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 38%;"></div>
                </div>
                <span class="pf-badge pf-low">0.92</span>
            </div>

            <div class="asset-row">
                <span class="asset-name">NAS100</span>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 61%;"></div>
                </div>
                <span class="pf-badge pf-high">2.15</span>
            </div>
        </div>

        <div class="footer-insight">
            <strong>FOCUS INSIGHT:</strong><br>
            Your performance on <strong>EUR/USD</strong> is dragging down your expectancy. Consider focusing on <strong>BTC</strong> and <strong>NASDAQ</strong> for better edge.
        </div>
    </div>


    <script>
        function renderAssets(trades) {
            const list = document.querySelector('.asset-list');
            list.innerHTML = '';
            if (!trades || trades.length === 0) return;

            // Group by symbol
            const groups = {};
            trades.forEach(t => {
                const sym = t.symbol || 'Unknown';
                if (!groups[sym]) groups[sym] = { wins: 0, losses: 0, total: 0, winPnl: 0, lossPnl: 0 };
                groups[sym].total++;
                if (t.pnl > 0) {
                    groups[sym].wins++;
                    groups[sym].winPnl += t.pnl;
                } else if (t.pnl < 0) {
                    groups[sym].losses++;
                    groups[sym].lossPnl += Math.abs(t.pnl);
                }
            });

            const sortedAssets = Object.entries(groups)
                .map(([name, s]) => ({
                    name,
                    winrate: (s.wins / s.total) * 100,
                    pf: s.lossPnl === 0 ? (s.winPnl > 0 ? 5.0 : 0) : s.winPnl / s.lossPnl,
                    total: s.total
                }))
                .sort((a, b) => b.total - a.total)
                .slice(0, 5);

            sortedAssets.forEach(a => {
                const row = document.createElement('div');
                row.className = 'asset-row';
                
                const pfClass = a.pf >= 2 ? 'pf-high' : a.pf >= 1 ? 'pf-mid' : 'pf-low';
                
                row.innerHTML = `
                    <span class="asset-name">${a.name}</span>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: ${a.winrate}%;"></div>
                    </div>
                    <span class="pf-badge ${pfClass}">${a.pf.toFixed(2)}</span>
                `;
                list.appendChild(row);
            });
            
            // Insight
            const best = sortedAssets.sort((a,b) => b.pf - a.pf)[0];
            const worst = sortedAssets.sort((a,b) => a.pf - b.pf)[0];
            const insight = document.querySelector('.footer-insight');
            if (insight && best && worst) {
                insight.innerHTML = `<strong>FOCUS INSIGHT:</strong><br>
                Your edge is strongest on <strong>${best.name}</strong> (PF: ${best.pf.toFixed(2)}). 
                ${worst.pf < 1 ? `Performance on <strong>${worst.name}</strong> is dragging you down.` : `Keep refining your strategy on ${worst.name}.`}`;
            }
        }
    </script>

    <!-- Creatix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'CREATIX_DATA') return;
        var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades === 0 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }

        if (d.trades) {
            renderAssets(d.trades);
        }
    });
    </script>

</body>
</html>
