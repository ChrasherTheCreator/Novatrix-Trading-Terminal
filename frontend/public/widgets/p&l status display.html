<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=show_chart" />
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-green: #00ffa3;
            --phosphor-red: #ff3366;
            --gloss-purple: #a855f7;
            --surface-shine: rgba(255, 255, 255, 0.03);
            --phosphor-glow-green: rgba(0, 255, 163, 0.15);
            --phosphor-glow-red: rgba(255, 51, 102, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-display {
            position: relative;
            width: 250px;
            height: 160px;
            padding: 24px 20px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            border: 1px solid rgba(157, 78, 221, 0.15);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);

            container-type: inline-size;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .obsidian-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(157, 78, 221, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gloss-purple);
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.8;
        }

        .label::after {
            content: '';
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, rgba(157, 78, 221, 0.3), transparent);
        }

        .value-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-width: 0;
        }

        .profit-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            margin: 0;
            white-space: nowrap;
            display: inline-block;
            max-width: 100%;
            text-align: left;
            margin-bottom: 16px;
        }

        .is-positive {
            color: var(--phosphor-green);
            text-shadow: 0 0 15px var(--phosphor-glow-green), 0 0 30px var(--phosphor-glow-green);
        }

        .is-negative {
            color: var(--phosphor-red);
            text-shadow: 0 0 15px var(--phosphor-glow-red), 0 0 30px var(--phosphor-glow-red);
        }

        .meta-data {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .percentage {
            font-size: clamp(10px, 8cqw, 16px);
            font-weight: 600;
        }

        .timeframe {
            font-size: 12px;
            color: #555;
            font-weight: 300;
            line-height: 1;
        }

        .obsidian-display:hover {
            /*transform: translateY(-4px) scale(1.02);*/   
            border-color: rgba(157, 78, 221, 0.4);
        }

        .gloss-reflection {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }
    </style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>

<body>

    <div class="obsidian-display" id="profitWidget" onclick="toggleState()">
        <div class="gloss-reflection"></div>
        <div class="label">
            <span class="material-symbols-outlined" style="font-size: 18px;">show_chart</span>
            Total P&L
        </div>
        <div class="value-container">
            <h1 id="profitDisplay" class="profit-value is-positive">+$12,482.90</h1>
        </div>
        <div class="meta-data">
            <div id="percentageDisplay" class="percentage is-positive">+14.2%</div>
            <div class="timeframe">ALL TIME</div>
        </div>
    </div>

    <script>
        let isPositive = true;
        const profitDisplay = document.getElementById('profitDisplay');
        const percentageDisplay = document.getElementById('percentageDisplay');
        const widget = document.getElementById('profitWidget');

        function adjustFontSize() {
            const container = profitDisplay.parentElement;
            let size = 36;
            profitDisplay.style.fontSize = size + 'px';
            
            while (profitDisplay.scrollWidth > container.clientWidth && size > 10) {
                size--;
                profitDisplay.style.fontSize = size + 'px';
            }
        }

        function toggleState() {
            isPositive = !isPositive;
            if (isPositive) {
                profitDisplay.innerText = "+$12,482.90";
                profitDisplay.className = "profit-value is-positive";
                percentageDisplay.innerText = "+14.2%";
                percentageDisplay.className = "percentage is-positive";
            } else {
                profitDisplay.innerText = "-$4,120.35";
                profitDisplay.className = "profit-value is-negative";
                percentageDisplay.innerText = "-3.8%";
                percentageDisplay.className = "percentage is-negative";
            }
            adjustFontSize();
            widget.style.transform = 'scale(0.95)';
            setTimeout(() => { widget.style.transform = ''; }, 100);
        }

        window.addEventListener('load', adjustFontSize);
    </script>

    <!-- Novatrix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'NOVATRIX_DATA') return;
        var d = e.data;
        try {
            switch(d.widgetId) {
                case 'pnl-status': {
                    var el = document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var pnl = d.totalPnl || 0;
                        var isPos = pnl >= 0;
                        el.innerText = (isPos ? '+' : '-') + '

</html> + Math.abs(pnl).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        el.className = 'profit-value ' + (isPos ? 'is-positive' : 'is-negative');
                        if (typeof adjustFontSize === 'function') adjustFontSize();
                    }
                    if (pctEl && d.totalTrades > 0) {
                        var pct = ((d.totalPnl / 10000) * 100);
                        pctEl.innerText = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
                        pctEl.className = 'percentage ' + (pct >= 0 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'profit-factor': {
                    var el = document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var pf = d.profitFactor || 0;
                        el.innerText = pf.toFixed(2);
                        el.className = 'profit-value ' + (pf >= 1 ? 'is-positive' : 'is-negative');
                    }
                    if (pctEl) {
                        pctEl.innerText = pf >= 1.5 ? 'STRONG' : pf >= 1 ? 'FAIR' : 'WEAK';
                        pctEl.className = 'percentage ' + (pf >= 1 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'sharpe-ratio': {
                    var el = document.getElementById('sharpeDisplay') || document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var sr = d.sharpeRatio || 0;
                        el.innerText = sr.toFixed(2);
                        el.className = el.className.replace(/is-\w+/g, '') + (sr >= 1 ? ' is-positive' : sr >= 0 ? '' : ' is-negative');
                    }
                    if (pctEl) {
                        pctEl.innerText = sr >= 2 ? 'EXCELLENT' : sr >= 1 ? 'GOOD' : sr >= 0 ? 'FAIR' : 'POOR';
                        pctEl.className = 'percentage ' + (sr >= 1 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'winrate': {
                    var el = document.getElementById('winrateDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        el.innerText = (d.winRate || 0).toFixed(2) + '%';
                    }
                    if (pctEl) {
                        var wr = d.winRate || 0;
                        pctEl.innerText = wr >= 50 ? 'ABOVE AVG' : 'BELOW AVG';
                        pctEl.className = 'percentage ' + (wr >= 50 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'total-trades': {
                    var el = document.getElementById('tradesDisplay') || document.querySelector('.profit-value, .winrate-value, h1');
                    if (el) {
                        el.innerText = String(d.totalTrades || 0);
                    }
                    break;
                }
                case 'novatrix-score': {
                    var el = document.querySelector('.score-value, .profit-value, h1');
                    if (el) {
                        el.innerText = String(d.novatrixScore || 0);
                    }
                    break;
                }
                case 'equity-drawdown': {
                    var el = document.querySelector('.drawdown-value, .profit-value, h1');
                    if (el) {
                        var dd = d.maxDrawdown || 0;
                        el.innerText = dd.toFixed(2) + '%';
                    }
                    break;
                }
            }
        } catch(err) { /* silently ignore */ }
    });
    </script>
</body>

</html>
