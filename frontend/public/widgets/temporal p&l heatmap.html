<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-purple: #a855f7;
            --phosphor-glow: rgba(168, 85, 247, 0.2);
            --profit-max: #00ffa3;
            --profit-mid: #064e3b;
            --loss-max: #ff3366;
            --loss-mid: #4c0519;
            --text-muted: #555555;
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent !important;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Ambient Glow Background - Subtle */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, var(--phosphor-glow) 0%, transparent 60%);
            z-index: -1;
            filter: blur(40px);
            opacity: 0.5;
        }

        .obsidian-display {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 20px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 48px;
            margin-top: 12px;
            position: relative;
            z-index: 2;
        }

        .header-title h1 {
            font-size: 1.75rem;
            /* Slightly smaller title */
            letter-spacing: -0.01em;
            color: var(--phosphor-purple);
            margin-bottom: 2px;
            font-weight: 700;
        }

        .header-title p {
            color: #64748b;
            font-size: 0.75rem;
            /* Smaller subtext */
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin: 0;
        }

        .stats-summary {
            display: flex;
            gap: 24px;
            margin-bottom: 12px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }

        .stat-value.purple {
            color: var(--phosphor-purple);
            text-shadow: 0 0 10px var(--phosphor-glow);
        }

        .heatmap-wrapper {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: 20px auto;
            gap: 12px 16px;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            min-height: 0;
            padding: 4px;
        }

        .x-axis {
            grid-row: 1;
            grid-column: 2;
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-align: center;
            align-items: center;
        }

        .y-axis {
            grid-row: 2;
            grid-column: 1;
            display: grid;
            grid-template-rows: repeat(7, 1fr);
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-align: right;
            padding-right: 4px;
        }

        .y-axis div {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .grid-main {
            grid-row: 2;
            grid-column: 2;
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            gap: 4px;
            align-items: center;
            justify-items: center;
        }

        /* Cell Styling */
        .cell {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 40px;
            /* Prevent oversized cells */
            margin: 0 auto;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s cubic-bezier(0.2, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
        }

        .cell:hover {
            transform: scale(1.4);
            z-index: 10;
            box-shadow: 0 0px 15px rgba(0, 0, 0, 0.5);
            outline: 1px solid var(--phosphor-purple);
        }

        /* Data Colors */
        .p-4 {
            background: var(--profit-max);
            box-shadow: 0 0 10px rgba(0, 255, 163, 0.3);
        }

        .p-3 {
            background: #059669;
        }

        .p-2 {
            background: #065f46;
        }

        .p-1 {
            background: #064e3b;
        }

        .neutral {
            background: rgba(255, 255, 255, 0.05);
        }

        .l-1 {
            background: #4c0519;
        }

        .l-2 {
            background: #881337;
        }

        .l-3 {
            background: #be123c;
        }

        .l-4 {
            background: var(--loss-max);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: #000;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            border: 1px solid var(--phosphor-purple);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            z-index: 100;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%);
        }

        .cell:hover .tooltip {
            opacity: 1;
        }

        .legend {
            margin-top: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .legend-gradient {
            display: flex;
            gap: 4px;
        }

        .legend-cell {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cellFade {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }
</style>
    <style>
        body {
            background: transparent !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        body>div {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
    </style>
</head>

<body>

    <div class="obsidian-display">
        <div class="insufficient-data-overlay" id="noDataOverlay">
            <span>NEEDS MORE DATA</span>
            <p>Add trades to see stats</p>
        </div>

        <div class="header">
            <div class="header-title">
                <h1>Temporal P&L Distribution</h1>
                <p>Performance Heatmap</p>
            </div>
            <div class="legend">
                <span>Loss</span>
                <div class="legend-gradient">
                    <div class="legend-cell l-4"></div>
                    <div class="legend-cell l-3"></div>
                    <div class="legend-cell l-2"></div>
                    <div class="legend-cell neutral"></div>
                    <div class="legend-cell p-2"></div>
                    <div class="legend-cell p-3"></div>
                    <div class="legend-cell p-4"></div>
                </div>
                <span>Profit</span>
            </div>
        </div>

        <div class="heatmap-wrapper">
            <div class="corner-spacer"></div>
            <div class="x-axis" id="x-axis"></div>
            <div class="y-axis">
                <div>MON</div>
                <div>TUE</div>
                <div>WED</div>
                <div>THU</div>
                <div>FRI</div>
                <div>SAT</div>
                <div>SUN</div>
            </div>
            <div class="grid-main" id="grid"></div>
        </div>

        <div class="stats-summary" style="margin-top: 56px;">
            <div class="stat-item">
                <div class="stat-label">Peak Performance</div>
                <div class="stat-value purple">Wed 14:00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Avg Hourly Delta</div>
                <div class="stat-value">+$1,240.42</div>
            </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const xAxis = document.getElementById('x-axis');
        const days = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];

        // Generate X-Axis Labels
        for (let i = 0; i < 24; i++) {
            const hour = document.createElement('div');
            hour.textContent = i.toString().padStart(2, '0');
            xAxis.appendChild(hour);
        }

        function renderHeatmap(trades) {
            grid.innerHTML = '';
            
            // Initialize 7x24 matrix
            const matrix = Array.from({ length: 7 }, () => Array(24).fill(0));
            
            if (trades && trades.length > 0) {
                trades.forEach(t => {
                    const date = new Date(t.entry_time || t.created_at);
                    const day = (date.getDay() + 6) % 7; // Monday = 0
                    const hour = date.getHours();
                    matrix[day][hour] += (t.pnl || 0);
                });
            }

            // Find max/min for scaling
            const allVals = matrix.flat();
            const maxPnl = Math.max(...allVals, 1);
            const minPnl = Math.min(...allVals, -1);

            for (let d = 0; d < 7; d++) {
                for (let h = 0; h < 24; h++) {
                    const val = matrix[d][h];
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    let colorClass = 'neutral';
                    if (val > 0) {
                        const intensity = val / maxPnl;
                        if (intensity > 0.75) colorClass = 'p-4';
                        else if (intensity > 0.5) colorClass = 'p-3';
                        else if (intensity > 0.25) colorClass = 'p-2';
                        else colorClass = 'p-1';
                    } else if (val < 0) {
                        const intensity = val / minPnl;
                        if (intensity > 0.75) colorClass = 'l-4';
                        else if (intensity > 0.5) colorClass = 'l-3';
                        else if (intensity > 0.25) colorClass = 'l-2';
                        else colorClass = 'l-1';
                    }

                    cell.classList.add(colorClass);

                    // Tooltip
                    const tooltip = document.createElement('div');
                    tooltip.className = 'tooltip';
                    tooltip.innerHTML = `<strong>${days[d]} ${h}:00</strong><br/>${val >= 0 ? '+' : ''}$${val.toLocaleString(undefined, {minimumFractionDigits:2})}`;
                    cell.appendChild(tooltip);

                    grid.appendChild(cell);
                }
            }
        }

        renderHeatmap([]);
    </script>

    <!-- Novatrix Data Bridge -->
    <script>
        window.addEventListener('message', function (e) {
            if (!e.data || e.data.type !== 'NOVATRIX_DATA') return;
            var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades < 1 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }

            if (d.trades) {
                renderHeatmap(d.trades);
                
                // Update stats summary if possible
                // Find peak performance hour
                // ... (optional refinement)
            }
        });
    </script>

</body>

</html>
