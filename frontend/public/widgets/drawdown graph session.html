<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --obsidian-deep: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-red: #ff3366;
            --phosphor-glow-red: rgba(255, 51, 102, 0.2);
            --grid-line: rgba(255, 51, 102, 0.05);
            --text-main: #f8fafc;
            --text-dim: #555555;
            --border-subtle: rgba(255, 51, 102, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-card {
            position: relative;
            width: 516px;
            height: 336px;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .title-group .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--phosphor-red);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drawdown-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 5px;
        }

        .stats-side {
            text-align: right;
        }

        .stat-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; }
        .stat-val { font-size: 12px; color: var(--phosphor-red); font-weight: 700; }

        .svg-viewport {
            width: 100%;
            height: 140px;
            margin-top: 10px;
            filter: drop-shadow(0 0 15px rgba(255, 51, 102, 0.1));
        }

        .drawdown-path {
            fill: url(#redGradient);
            stroke: var(--phosphor-red);
            stroke-width: 2;
        }

        .grid-line {
            stroke: rgba(255, 255, 255, 0.03);
            stroke-width: 1;
        }

        .be-line {
            stroke: var(--text-dim);
            stroke-width: 1;
            stroke-dasharray: 4;
            opacity: 0.3;
        }

        .chart-viewport {
            position: relative;
            width: 100%;
            height: 180px;
            cursor: crosshair;
        }

        .tooltip {
            position: absolute;
            background: var(--obsidian-surface);
            border: 1px solid var(--border-subtle);
            padding: 8px 12px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
            transform: translate(-50%, -120%);
        }

        .tt-date { font-size: 9px; color: var(--text-dim); display: block; margin-bottom: 2px; }
        .tt-val { font-size: 11px; color: var(--phosphor-red); font-weight: 700; }

        svg { overflow: visible; }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }
</style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>
<body>

    <div class="obsidian-card">
        <div class="header">
            <div class="title-group">
                <div class="label">
                    <span class="material-symbols-outlined" style="font-size: 14px;">warning</span>
                    Live Drawdown
                </div>
                <div class="drawdown-value" id="currentVal">-$1,240.50</div>
            </div>
            <div class="stats-side">
                <div class="stat-label">Max DD (Session)</div>
                <div class="stat-val">-$2,850.00</div>
            </div>
        </div>

        <div class="chart-viewport" id="viewport">
            <div class="tooltip" id="tooltip">
                <span class="tt-date" id="ttDate">--</span>
                <span class="tt-val" id="ttValue">--</span>
            </div>

            <svg id="chartSvg" width="100%" height="100%" viewBox="0 0 456 180" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="drawdownGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--phosphor-red)" stop-opacity="0.25" />
                        <stop offset="100%" stop-color="var(--phosphor-red)" stop-opacity="0" />
                    </linearGradient>
                </defs>

                <line x1="0" y1="45" x2="456" y2="45" stroke="var(--grid-line)" />
                <line x1="0" y1="90" x2="456" y2="90" stroke="var(--grid-line)" />
                <line x1="0" y1="135" x2="456" y2="135" stroke="var(--grid-line)" />
                
                <line x1="0" y1="0" x2="456" y2="0" stroke="var(--text-dim)" stroke-opacity="0.3" stroke-dasharray="4" />

                <path id="mainPath" fill="none" stroke="var(--phosphor-red)" stroke-width="2" />
                <path id="fillPath" fill="url(#drawdownGradient)" stroke="none" />

                <line id="hoverLine" x1="0" y1="0" x2="0" y2="180" stroke="var(--phosphor-red)" stroke-width="1" stroke-dasharray="4" style="opacity: 0;" />
                <circle id="focusPoint" r="4" fill="var(--phosphor-red)" style="opacity: 0; filter: drop-shadow(0 0 5px var(--phosphor-red));" />
            </svg>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 15px; font-family: 'JetBrains Mono'; font-size: 12px; color: var(--text-dim); text-transform: uppercase;">
            <span>Current Period</span>
            <span>Drawdown Time: 04:22:15</span>
        </div>
    </div>

    <script>
        const data = [
            { time: "09:00", value: 0 }, { time: "09:30", value: -200 },
            { time: "10:00", value: -150 }, { time: "10:30", value: -600 },
            { time: "11:00", value: -400 }, { time: "11:30", value: -1200 },
            { time: "12:00", value: -900 }, { time: "12:30", value: -1800 },
            { time: "13:00", value: -1400 }, { time: "13:30", value: -2200 },
            { time: "14:00", value: -1900 }, { time: "14:30", value: -1240 }
        ];

        const width = 456;
        const height = 180;
        const maxDrawdown = -2500; // Skalierung bis -2500

        const points = data.map((d, i) => ({
            x: (i / (data.length - 1)) * width,
            y: (d.value / maxDrawdown) * height,
            value: d.value,
            time: d.time
        }));

        const dString = `M ${points.map(p => `${p.x},${p.y}`).join(' L ')}`;
        document.getElementById('mainPath').setAttribute("d", dString);
        document.getElementById('fillPath').setAttribute("d", `${dString} V 0 H 0 Z`);
        document.getElementById('currentVal').textContent = `-$${Math.abs(data[data.length-1].value).toLocaleString()}`;

        const viewport = document.getElementById('viewport');
        const tooltip = document.getElementById('tooltip');
        const hoverLine = document.getElementById('hoverLine');
        const focusPoint = document.getElementById('focusPoint');

        viewport.addEventListener('mousemove', (e) => {
            const rect = viewport.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (width / rect.width);
            
            let closest = points[0];
            let minDiff = Math.abs(mouseX - points[0].x);
            points.forEach(p => {
                const diff = Math.abs(mouseX - p.x);
                if (diff < minDiff) { minDiff = diff; closest = p; }
            });

            hoverLine.setAttribute("x1", closest.x);
            hoverLine.setAttribute("x2", closest.x);
            hoverLine.style.opacity = "0.5";
            
            focusPoint.setAttribute("cx", closest.x);
            focusPoint.setAttribute("cy", closest.y);
            focusPoint.style.opacity = "1";

            tooltip.style.opacity = "1";
            tooltip.style.left = `${(closest.x / width) * 100}%`;
            tooltip.style.top = `${(closest.y / height) * 100}%`;
            
            document.getElementById('ttDate').textContent = closest.time;
            document.getElementById('ttValue').textContent = `-$${Math.abs(closest.value).toLocaleString()}`;
        });

        viewport.addEventListener('mouseleave', () => {
            hoverLine.style.opacity = "0";
            focusPoint.style.opacity = "0";
            tooltip.style.opacity = "0";
        });
    </script>

    <script>
        const width = 456;
        const height = 180;
        let points = [];

        function renderSessionDrawdown(trades) {
            if (!trades || trades.length === 0) return;
            
            // Get today's trades or most recent 10 trades if today is empty
            const sortedTrades = [...trades].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const recentTrades = sortedTrades.slice(-15);
            
            let runningPnl = 0;
            let peakPnl = 0;
            let maxDD = 0;
            
            const ddData = [{ time: 'START', value: 0 }];
            recentTrades.forEach(t => {
                runningPnl += (t.pnl || 0);
                if (runningPnl > peakPnl) peakPnl = runningPnl;
                const dd = runningPnl - peakPnl;
                if (dd < maxDD) maxDD = dd;
                
                const dateObj = new Date(t.entry_time || t.created_at);
                const label = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                ddData.push({ time: label, value: dd });
            });

            const currentDD = ddData[ddData.length - 1].value;
            document.getElementById('currentVal').textContent = currentDD >= 0 ? '$0.00' : `-$${Math.abs(currentDD).toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.querySelector('.stat-val').textContent = `-$${Math.abs(maxDD).toLocaleString(undefined, {minimumFractionDigits:2})}`;

            const minDD = Math.min(...ddData.map(d => d.value), -100);
            
            points = ddData.map((d, i) => ({
                x: (i / (ddData.length - 1)) * width,
                y: minDD !== 0 ? (d.value / minDD) * height : 0,
                value: d.value,
                time: d.time
            }));

            const dString = points.length > 0 ? `M ${points.map(p => `${p.x},${p.y}`).join(' L ')}` : 'M 0,0';
            document.getElementById('mainPath').setAttribute("d", dString);
            document.getElementById('fillPath').setAttribute("d", `${dString} V 0 H 0 Z`);
        }

        const viewport = document.getElementById('viewport');
        const tooltip = document.getElementById('tooltip');
        const hoverLine = document.getElementById('hoverLine');
        const focusPoint = document.getElementById('focusPoint');

        viewport.addEventListener('mousemove', (e) => {
            if (!points.length) return;
            const rect = viewport.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (width / rect.width);

            let closest = points[0];
            let minDiff = Math.abs(mouseX - points[0].x);
            points.forEach(p => {
                const diff = Math.abs(mouseX - p.x);
                if (diff < minDiff) { minDiff = diff; closest = p; }
            });

            hoverLine.setAttribute("x1", closest.x);
            hoverLine.setAttribute("x2", closest.x);
            hoverLine.style.opacity = "0.5";

            focusPoint.setAttribute("cx", closest.x);
            focusPoint.setAttribute("cy", closest.y);
            focusPoint.style.opacity = "1";

            tooltip.style.opacity = "1";
            tooltip.style.left = `${(closest.x / width) * 100}%`;
            tooltip.style.top = `${(closest.y / height) * 100}%`;

            document.getElementById('ttDate').textContent = closest.time;
            document.getElementById('ttValue').textContent = closest.value >= 0 ? '$0.00' : `-$${Math.abs(closest.value).toLocaleString()}`;
        });

        viewport.addEventListener('mouseleave', () => {
            hoverLine.style.opacity = "0";
            focusPoint.style.opacity = "0";
            tooltip.style.opacity = "0";
        });
        
        renderSessionDrawdown([]);
    </script>

    <!-- Creatix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'CREATIX_DATA') return;
        var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades === 0 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }

        if (d.trades) {
            renderSessionDrawdown(d.trades);
        }
    });
    </script>

</body>
</html>
