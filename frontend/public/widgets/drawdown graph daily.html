<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-red: #ff3366;
            --phosphor-glow-red: rgba(255, 51, 102, 0.2);
            --grid-line: rgba(255, 51, 102, 0.05);
            --text-main: #f8fafc;
            --text-dim: #555555;
            --border-subtle: rgba(255, 51, 102, 0.15);
        }

        body {
            background-color: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-card {
            position: relative;
            width: 516px;
            height: 336px;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: none !important;
            box-shadow: none !important;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .title-group .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--phosphor-red);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drawdown-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary, var(--text-main));
            margin-top: 5px;
        }

        .stats-side {
            text-align: right;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 12px;
            color: var(--phosphor-red);
            font-weight: 700;
        }

        .svg-viewport {
            width: 100%;
            height: 140px;
            margin-top: 10px;
            filter: drop-shadow(0 0 15px rgba(255, 51, 102, 0.1));
        }

        .drawdown-path {
            fill: url(#redGradient);
            stroke: var(--phosphor-red);
            stroke-width: 2;
        }

        .grid-line {
            stroke: rgba(255, 255, 255, 0.03);
            stroke-width: 1;
        }

        .be-line {
            stroke: var(--text-dim);
            stroke-width: 1;
            stroke-dasharray: 4;
            opacity: 0.3;
        }

        .chart-viewport {
            position: relative;
            width: 100%;
            height: 180px;
            cursor: crosshair;
        }

        .tooltip {
            position: absolute;
            background: var(--obsidian-surface);
            border: none !important;
            padding: 8px 12px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
            transform: translate(-50%, -120%);
        }

        .tt-date {
            font-size: 9px;
            color: var(--text-dim);
            display: block;
            margin-bottom: 2px;
        }

        .tt-val {
            font-size: 11px;
            color: var(--phosphor-red);
            font-weight: 700;
        }

        svg {
            overflow: visible;
        }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }

        /* Automatic Light Mode styling */
        .light-mode {
            --obsidian-base: #f8fafc;
            --obsidian-surface: #ffffff;
            --text-primary: #020617;
            --text-main: #020617;
            --text-dim: #64748b;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-subtle: rgba(139, 92, 246, 0.15);
            --surface-shine: rgba(0, 0, 0, 0.02);
            --grid-line: rgba(139, 92, 246, 0.08);
            --glow-accent: rgba(139, 92, 246, 0.05);
            --phosphor-green: #059669;
            --phosphor-red: #dc2626;
            --phosphor-glow-green: rgba(5, 150, 105, 0.1);
            --phosphor-glow-red: rgba(220, 38, 38, 0.1);
            --gloss-purple: #7c3aed;
        }
        .light-mode body {
            color: var(--text-primary) !important;
        }
        .light-mode .obsidian-display,
        .light-mode .creatix-card,
        .light-mode .card,
        .light-mode .widget-container,
        .light-mode .display-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        .light-mode svg text {
            fill: var(--text-dim) !important;
        }
        .light-mode .timeframe {
            color: var(--text-muted) !important;
        }
        .light-mode .label {
            color: var(--gloss-purple) !important;
        }
        .light-mode .stat-value.purple {
            color: var(--gloss-purple) !important;
        }
</style>
    <style>
        body {
            background: transparent !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        body>div {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
    </style>
</head>

<body>

    <div class="obsidian-card">
        <div class="header">
            <div class="title-group">
                <div class="label">
                    <span class="material-symbols-outlined" style="font-size: 14px;">warning</span>
                    Live Drawdown
                </div>
                <div class="drawdown-value" id="currentVal">-$1,240.50</div>
            </div>
            <div class="stats-side">
                <div class="stat-label">Max DD</div>
                <div class="stat-val">-$2,850.00</div>
            </div>
        </div>

        <div class="chart-viewport" id="viewport">
            <div class="tooltip" id="tooltip">
                <span class="tt-date" id="ttDate">--</span>
                <span class="tt-val" id="ttValue">--</span>
            </div>

            <svg id="chartSvg" width="100%" height="100%" viewBox="0 0 456 180" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="drawdownGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--phosphor-red)" stop-opacity="0.25" />
                        <stop offset="100%" stop-color="var(--phosphor-red)" stop-opacity="0" />
                    </linearGradient>
                </defs>

                <line x1="0" y1="45" x2="456" y2="45" stroke="var(--grid-line)" />
                <line x1="0" y1="90" x2="456" y2="90" stroke="var(--grid-line)" />
                <line x1="0" y1="135" x2="456" y2="135" stroke="var(--grid-line)" />

                <line x1="0" y1="0" x2="456" y2="0" stroke="var(--text-dim)" stroke-opacity="0.3"
                    stroke-dasharray="4" />

                <path id="mainPath" fill="none" stroke="var(--phosphor-red)" stroke-width="2" />
                <path id="fillPath" fill="url(#drawdownGradient)" stroke="none" />

                <line id="hoverLine" x1="0" y1="0" x2="0" y2="180" stroke="var(--phosphor-red)" stroke-width="1"
                    stroke-dasharray="4" style="opacity: 0;" />
                <circle id="focusPoint" r="4" fill="var(--phosphor-red)"
                    style="opacity: 0; filter: drop-shadow(0 0 5px var(--phosphor-red));" />
            </svg>
        </div>

        <div
            style="display: flex; justify-content: space-between; margin-top: 15px; font-family: 'JetBrains Mono'; font-size: 12px; color: var(--text-dim); text-transform: uppercase;">
            <span>Current Period (All time)</span>
            <span>Drawdown Time: 6 Days</span>
        </div>
    </div>

    <script>
        const width = 456;
        const height = 180;
        let points = [];

        function renderDrawdown(trades) {
            if (!trades || trades.length === 0) return;
            
            const sortedTrades = [...trades].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            let runningPnl = 0;
            let peakPnl = 0;
            let currentDrawdown = 0;
            let maxDrawdownValue = 0;
            
            const ddData = [{ time: 'START', value: 0 }];
            
            sortedTrades.forEach(t => {
                runningPnl += (t.pnl || 0);
                if (runningPnl > peakPnl) peakPnl = runningPnl;
                const dd = runningPnl - peakPnl;
                if (dd < maxDrawdownValue) maxDrawdownValue = dd;
                
                var dateObj = new Date(t.created_at);
                var label = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                ddData.push({ time: label, value: dd });
            });

            const currentDD = ddData[ddData.length - 1].value;
            document.getElementById('currentVal').textContent = currentDD >= 0 ? '$0.00' : `-$${Math.abs(currentDD).toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.querySelector('.stat-val').textContent = `-$${Math.abs(maxDrawdownValue).toLocaleString(undefined, {minimumFractionDigits:2})}`;

            const minDD = Math.min(...ddData.map(d => d.value), -100);
            
            points = ddData.map((d, i) => ({
                x: (i / (ddData.length - 1)) * width,
                y: minDD !== 0 ? (d.value / minDD) * height : 0,
                value: d.value,
                time: d.time
            }));

            const dString = points.length > 0 ? `M ${points.map(p => `${p.x},${p.y}`).join(' L ')}` : 'M 0,0';
            document.getElementById('mainPath').setAttribute("d", dString);
            document.getElementById('fillPath').setAttribute("d", `${dString} V 0 H 0 Z`);
        }

        const viewport = document.getElementById('viewport');
        const tooltip = document.getElementById('tooltip');
        const hoverLine = document.getElementById('hoverLine');
        const focusPoint = document.getElementById('focusPoint');

        viewport.addEventListener('mousemove', (e) => {
            if (!points.length) return;
            const rect = viewport.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (width / rect.width);

            let closest = points[0];
            let minDiff = Math.abs(mouseX - points[0].x);
            points.forEach(p => {
                const diff = Math.abs(mouseX - p.x);
                if (diff < minDiff) { minDiff = diff; closest = p; }
            });

            hoverLine.setAttribute("x1", closest.x);
            hoverLine.setAttribute("x2", closest.x);
            hoverLine.style.opacity = "0.5";

            focusPoint.setAttribute("cx", closest.x);
            focusPoint.setAttribute("cy", closest.y);
            focusPoint.style.opacity = "1";

            tooltip.style.opacity = "1";
            tooltip.style.left = `${(closest.x / width) * 100}%`;
            tooltip.style.top = `${(closest.y / height) * 100}%`;

            document.getElementById('ttDate').textContent = closest.time;
            document.getElementById('ttValue').textContent = closest.value >= 0 ? '$0.00' : `-$${Math.abs(closest.value).toLocaleString()}`;
        });

        viewport.addEventListener('mouseleave', () => {
            hoverLine.style.opacity = "0";
            focusPoint.style.opacity = "0";
            tooltip.style.opacity = "0";
        });
        
        renderDrawdown([]);
    </script>

    <!-- Creatix Data Bridge -->
    <script>
        window.addEventListener('message', function (e) {
            if (!e.data || e.data.type !== 'CREATIX_DATA') return;
            var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades === 0 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }

            if (d.trades) {
                renderDrawdown(d.trades);
            }
        });
    </script>

</body>

</html>
