<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anodized Obsidian Trading Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #080809;
            --card-base: #121214;
            --border-muted: rgba(255, 255, 255, 0.04);
            --text-main: #e4e4e7;
            --text-dim: #71717a;
            
            --tokyo-accent: #00a2ff;
            --london-accent: #00FFFF;
            --newyork-accent: #FF00BD;
            --sydney-accent: #F8F900;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-obsidian);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Noise Texture Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03;
            pointer-events: none;
            z-index: 10;
        }

        .obsidian-display {
            position: relative;
            width: 516px;
            height: 336px;
            background: linear-gradient(145deg, #0f0f12 0%, #050507 100%);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dashboard-container {
            display: grid;
            gap: 16px;
            width: 100%;
            height: 100%;
            perspective: 1000px;
            transition: all 0.5s ease;
        }

        /* CONFIG 1: COMPACT (1x1 User / ~250x160) */
        body.mode-compact .dashboard-container {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }
        body.mode-compact .module {
            display: none;
            width: 100%;
            height: 100%;
        }
        body.mode-compact .module.active-session {
            display: flex;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* CONFIG 2: STANDARD (2x2 User / ~516x336) */
        body.mode-standard .dashboard-container {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 516px;
            height: 336px;
        }
        body.mode-standard .module {
            width: 250px;
            height: 160px;
        }

        /* CONFIG 3: HIGH-DENSITY (3x3 User / ~782x512) */
        body.mode-high-density .dashboard-container {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 782px;
            height: 512px;
        }
        body.mode-high-density .module {
            width: 383px;
            height: 248px;
            padding: 24px;
        }
        body.mode-high-density .performance-value {
            font-size: 3.5rem;
        }
        body.mode-high-density .sparkline {
            display: block !important;
        }
        
        .sparkline {
            display: none;
            width: 100%;
            height: 40px;
            margin-top: 10px;
        }

        .module {
            position: relative;
            width: 250px;
            height: 160px;
            background: linear-gradient(145deg, #18181b 0%, #0d0d0f 100%);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-muted);
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.8s cubic-bezier(0.2, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .module:nth-child(1) { animation-delay: 0.1s; --accent: var(--tokyo-accent); }
        .module:nth-child(2) { animation-delay: 0.2s; --accent: var(--london-accent); }
        .module:nth-child(3) { animation-delay: 0.3s; --accent: var(--newyork-accent); }
        .module:nth-child(4) { animation-delay: 0.4s; --accent: var(--sydney-accent); }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .module::after {
            content: "";
            position: absolute;
            top: 0; right: 0;
            width: 100px; height: 100px;
            background: radial-gradient(circle at 70% 30%, var(--accent), transparent 70%);
            filter: blur(40px);
            opacity: 0.15;
            transition: opacity 0.4s ease;
        }

        .module:hover {
            transform: scale(1.02) translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .module:hover::after {
            opacity: 0.35;
        }

        /* Anodized Highlight Top Edge */
        .module::before {
            content: "";
            position: absolute;
            top: 0; left: 16px; right: 16px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.4;
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .session-name {
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-name::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .duration {
            font-size: 0.7rem;
            color: var(--text-dim);
            background: rgba(255,255,255,0.03);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
        }

        .performance-value {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #fff, #a1a1aa);
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pnl-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 500;
        }

        .trend-line {
            margin-top: 16px;
            height: 2px;
            width: 100%;
            background: rgba(255,255,255,0.03);
            position: relative;
            overflow: hidden;
        }

        .trend-fill {
            position: absolute;
            left: 0; top: 0; height: 100%;
            width: 65%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
        }

        .footer {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .market-meta {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-top: 12px;
        }

    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Tokyo Session -->
        <div class="module">
            <div class="session-header">
                <div class="session-name">Tokyo</div>
                <div class="duration">0:00 - 08:00 UTC+1</div>
            </div>
            <div class="performance-value">+1.24%</div>
            <div class="pnl-chip">
                <span>▲</span> $3,420.00
            </div>
            <svg class="sparkline" viewBox="0 0 100 40">
                <path d="M0,35 L20,25 L40,30 L60,15 L80,20 L100,5" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
            </svg>
            <div class="footer">
                <div class="market-meta">VOLATILITY: MEDIUM</div>
            </div>
        </div>

        <!-- London Session -->
        <div class="module">
            <div class="session-header">
                <div class="session-name">London</div>
                <div class="duration">09:00 - 17:00 UTC+1</div>
            </div>
            <div class="performance-value">+2.81%</div>
            <div class="pnl-chip">
                <span>▲</span> $8,912.44
            </div>
            <svg class="sparkline" viewBox="0 0 100 40">
                <path d="M0,38 L25,30 L50,35 L75,10 L100,2" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
            </svg>
            <div class="footer">
                <div class="market-meta">VOLATILITY: HIGH</div>
            </div>
        </div>

        <!-- New York Session -->
        <div class="module">
            <div class="session-header">
                <div class="session-name">New York</div>
                <div class="duration">13:00 - 21:00 UTC+1</div>
            </div>
            <div class="performance-value">-0.42%</div>
            <div class="pnl-chip">
                <span>▼</span> -$1,120.30
            </div>
            <svg class="sparkline" viewBox="0 0 100 40">
                <path d="M0,10 L25,15 L50,25 L75,35 L100,38" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
            </svg>
            <div class="footer">
                <div class="market-meta">VOLATILITY: EXTREME</div>
            </div>
        </div>

        <!-- Sydney Session -->
        <div class="module">
            <div class="session-header">
                <div class="session-name">Sydney</div>
                <div class="duration">10:00 - 6:00 UTC+1</div>
            </div>
            <div class="performance-value">+0.18%</div>
            <div class="pnl-chip">
                <span>▲</span> $492.10
            </div>
            <svg class="sparkline" viewBox="0 0 100 40">
                <path d="M0,30 L20,35 L40,25 L60,20 L80,15 L100,10" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
            </svg>
            <div class="footer">
                <div class="market-meta">VOLATILITY: LOW</div>
            </div>
        </div>
    </div>

    <script>
        // Subtle tilt effect
        const modules = document.querySelectorAll('.module');
        modules.forEach(module => {
            module.addEventListener('mousemove', e => {
                const rect = module.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = (y - centerY) / 10;
                const rotateY = (centerX - x) / 10;
                
                module.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            });
            
            module.addEventListener('mouseleave', () => {
                module.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
            });
        });

        // Auto-assign active-session class (Simple mock: London is active)
        document.querySelectorAll('.module')[1].classList.add('active-session');

        // Adaptive Layout Switcher
        const observer = new ResizeObserver(entries => {
            const width = entries[0].contentRect.width;
            document.body.classList.remove('mode-compact', 'mode-standard', 'mode-high-density');
            
            if (width < 300) {
                document.body.classList.add('mode-compact');
            } else if (width < 700) {
                document.body.classList.add('mode-standard');
            } else {
                document.body.classList.add('mode-high-density');
            }
        });
        observer.observe(document.body);
    </script>

    <!-- Novatrix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'NOVATRIX_DATA') return;
        var d = e.data;
        try {
            switch(d.widgetId) {
                case 'pnl-status': {
                    var el = document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var pnl = d.totalPnl || 0;
                        var isPos = pnl >= 0;
                        el.innerText = (isPos ? '+' : '-') + '
</html> + Math.abs(pnl).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        el.className = 'profit-value ' + (isPos ? 'is-positive' : 'is-negative');
                        if (typeof adjustFontSize === 'function') adjustFontSize();
                    }
                    if (pctEl && d.totalTrades > 0) {
                        var pct = ((d.totalPnl / 10000) * 100);
                        pctEl.innerText = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
                        pctEl.className = 'percentage ' + (pct >= 0 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'profit-factor': {
                    var el = document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var pf = d.profitFactor || 0;
                        el.innerText = pf.toFixed(2);
                        el.className = 'profit-value ' + (pf >= 1 ? 'is-positive' : 'is-negative');
                    }
                    if (pctEl) {
                        pctEl.innerText = pf >= 1.5 ? 'STRONG' : pf >= 1 ? 'FAIR' : 'WEAK';
                        pctEl.className = 'percentage ' + (pf >= 1 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'sharpe-ratio': {
                    var el = document.getElementById('sharpeDisplay') || document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var sr = d.sharpeRatio || 0;
                        el.innerText = sr.toFixed(2);
                        el.className = el.className.replace(/is-\w+/g, '') + (sr >= 1 ? ' is-positive' : sr >= 0 ? '' : ' is-negative');
                    }
                    if (pctEl) {
                        pctEl.innerText = sr >= 2 ? 'EXCELLENT' : sr >= 1 ? 'GOOD' : sr >= 0 ? 'FAIR' : 'POOR';
                        pctEl.className = 'percentage ' + (sr >= 1 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'winrate': {
                    var el = document.getElementById('winrateDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        el.innerText = (d.winRate || 0).toFixed(2) + '%';
                    }
                    if (pctEl) {
                        var wr = d.winRate || 0;
                        pctEl.innerText = wr >= 50 ? 'ABOVE AVG' : 'BELOW AVG';
                        pctEl.className = 'percentage ' + (wr >= 50 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'total-trades': {
                    var el = document.getElementById('tradesDisplay') || document.querySelector('.profit-value, .winrate-value, h1');
                    if (el) {
                        el.innerText = String(d.totalTrades || 0);
                    }
                    break;
                }
                case 'novatrix-score': {
                    var el = document.querySelector('.score-value, .profit-value, h1');
                    if (el) {
                        el.innerText = String(d.novatrixScore || 0);
                    }
                    break;
                }
                case 'equity-drawdown': {
                    var el = document.querySelector('.drawdown-value, .profit-value, h1');
                    if (el) {
                        var dd = d.maxDrawdown || 0;
                        el.innerText = dd.toFixed(2) + '%';
                    }
                    break;
                }
            }
        } catch(err) { /* silently ignore */ }
    });
    </script>
</body>
</html>
