<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
    <style>
        :root {
            --obsidian-base: #050507;
            --phosphor-green: #00ffa3;
            --phosphor-red: #ff3366;
            --gloss-purple: #a855f7;
            --text-primary: #ffffff;
            --text-muted: #555555;
            --bg-secondary: rgba(255, 255, 255, 0.03);
            --border-subtle: rgba(157, 78, 221, 0.15);
            --accent-bright: #9d4edd;
            --accent-dim: rgba(157, 78, 221, 0.2);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        /* Obsidian Display Wrapper */
        .obsidian-display {
            position: relative;
            width: 516px;
            height: 512px;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Glanzeffekte */
        .obsidian-display::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(157, 78, 221, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .gloss-reflection {
            position: absolute;
            top: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }

        /*.obsidian-display:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(157, 78, 221, 0.4);
        }

        /* Radar Grid Styling */
        .radar-grid { stroke: rgba(255, 255, 255, 0.08); }
        .radar-axis { stroke: rgba(255, 255, 255, 0.1); }
        
        /* Stats Box Styling */
        .stat-card {
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(4px);
            margin-top: 12px;
        }

        .label-text {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
        }

        .value-text {
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: -0.01em;
        }
    </style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>
<body>

<div class="obsidian-display">
    <div class="gloss-reflection"></div>
    
    <div style="display: flex; align-items: center; gap: 0.4rem; color: var(--accent-bright); position: relative; z-index: 2; margin-bottom: 1.3rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"></path>
            <path d="M4 6h.01"></path>
            <path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"></path>
            <path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"></path>
            <path d="M12 18h.01"></path>
            <path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"></path>
            <circle cx="12" cy="12" r="2"></circle>
            <path d="m13.41 10.59 5.66-5.66"></path>
        </svg>
        <span style="font-size: 0.8rem; font-weight: 800; letter-spacing: 0.15em; color: var(--text-primary);">PERFORMANCE RADAR</span>
    </div>

    <div style="display: flex; justify-content: center; align-items: center; position: relative; z-index: 2; margin: 10px 0;">
        <svg width="320" height="320" viewBox="0 0 240 240" style="overflow: visible;">
            <g transform="translate(10, 10)">
                <polygon points="110,94.6 123.3,102.3 123.3,117.7 110,125.4 96.6,117.7 96.6,102.3" fill="none" class="radar-grid" stroke-width="1"></polygon>
                <polygon points="110,79.2 136.6,94.6 136.6,125.4 110,140.8 83.3,125.4 83.3,94.6" fill="none" class="radar-grid" stroke-width="1"></polygon>
                <polygon points="110,63.8 150.0,86.9 150.0,133.1 110,156.2 69.9,133.1 69.9,86.9" fill="none" class="radar-grid" stroke-width="1"></polygon>
                <polygon points="110,48.4 163.3,79.2 163.3,140.8 110,171.6 56.6,140.8 56.6,79.2" fill="none" class="radar-grid" stroke-width="1"></polygon>
                <polygon points="110,33 176.6,71.5 176.6,148.5 110,187 43.3,148.5 43.3,71.5" fill="none" class="radar-grid" stroke-width="1"></polygon>
                
                <line x1="110" y1="110" x2="110" y2="33" class="radar-axis" stroke-width="1"></line>
                <line x1="110" y1="110" x2="176.6" y2="71.5" class="radar-axis" stroke-width="1"></line>
                <line x1="110" y1="110" x2="176.6" y2="148.5" class="radar-axis" stroke-width="1"></line>
                <line x1="110" y1="110" x2="110" y2="187" class="radar-axis" stroke-width="1"></line>
                <line x1="110" y1="110" x2="43.3" y2="148.5" class="radar-axis" stroke-width="1"></line>
                <line x1="110" y1="110" x2="43.3" y2="71.5" class="radar-axis" stroke-width="1"></line>

                <polygon points="110,57.2 176.6,71.5 143.3,129.2 110,110 56.6,140.8 59.9,81.1" fill="var(--accent-dim)" stroke="var(--accent-bright)" stroke-width="2" style="opacity: 0.7;"></polygon>

                <g font-size="9" font-weight="900" fill="var(--text-primary)" text-anchor="middle" dominant-baseline="middle" style="letter-spacing: 0.05em;">
                    <text x="110" y="0">WINRATE</text>
                    <text x="225" y="54">PROF. FACTOR</text>
                    <text x="225" y="166">AVG R/R</text>
                    <text x="110" y="220">DISCIPLINE</text>
                    <text x="-5" y="166">EXECUTION</text>
                    <text x="-5" y="54">CONSISTENCY</text>
                    
                    <circle cx="110" cy="57.2" r="3" fill="var(--accent-bright)" stroke="var(--obsidian-base)" stroke-width="1"></circle>
                    <circle cx="176.6" cy="71.5" r="3" fill="var(--accent-bright)" stroke="var(--obsidian-base)" stroke-width="1"></circle>
                    <circle cx="143.3" cy="129.2" r="3" fill="var(--accent-bright)" stroke="var(--obsidian-base)" stroke-width="1"></circle>
                    <circle cx="110" cy="110" r="3" fill="var(--accent-bright)" stroke="var(--obsidian-base)" stroke-width="1"></circle>
                    <circle cx="56.6" cy="140.8" r="3" fill="var(--accent-bright)" stroke="var(--obsidian-base)" stroke-width="1"></circle>
                    <circle cx="59.9" cy="81.1" r="3" fill="var(--accent-bright)" stroke="var(--obsidian-base)" stroke-width="1"></circle>
                </g>
            </g>
        </svg>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-top: 0.8rem; position: relative; z-index: 2;">
        <div class="stat-card">
            <div class="label-text">DOMINANT</div>
            <div class="value-text" style="color: var(--phosphor-green);">Discipline</div>
        </div>
        <div class="stat-card">
            <div class="label-text">GROWTH OP</div>
            <div class="value-text" style="color: var(--phosphor-red);">Avg R/R</div>
        </div>
    </div>
</div>


    <!-- Novatrix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'NOVATRIX_DATA') return;
        var d = e.data;
        try {
            switch(d.widgetId) {
                case 'pnl-status': {
                    var el = document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var pnl = d.totalPnl || 0;
                        var isPos = pnl >= 0;
                        el.innerText = (isPos ? '+' : '-') + '
</html> + Math.abs(pnl).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        el.className = 'profit-value ' + (isPos ? 'is-positive' : 'is-negative');
                        if (typeof adjustFontSize === 'function') adjustFontSize();
                    }
                    if (pctEl && d.totalTrades > 0) {
                        var pct = ((d.totalPnl / 10000) * 100);
                        pctEl.innerText = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
                        pctEl.className = 'percentage ' + (pct >= 0 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'profit-factor': {
                    var el = document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var pf = d.profitFactor || 0;
                        el.innerText = pf.toFixed(2);
                        el.className = 'profit-value ' + (pf >= 1 ? 'is-positive' : 'is-negative');
                    }
                    if (pctEl) {
                        pctEl.innerText = pf >= 1.5 ? 'STRONG' : pf >= 1 ? 'FAIR' : 'WEAK';
                        pctEl.className = 'percentage ' + (pf >= 1 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'sharpe-ratio': {
                    var el = document.getElementById('sharpeDisplay') || document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var sr = d.sharpeRatio || 0;
                        el.innerText = sr.toFixed(2);
                        el.className = el.className.replace(/is-\w+/g, '') + (sr >= 1 ? ' is-positive' : sr >= 0 ? '' : ' is-negative');
                    }
                    if (pctEl) {
                        pctEl.innerText = sr >= 2 ? 'EXCELLENT' : sr >= 1 ? 'GOOD' : sr >= 0 ? 'FAIR' : 'POOR';
                        pctEl.className = 'percentage ' + (sr >= 1 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'winrate': {
                    var el = document.getElementById('winrateDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        el.innerText = (d.winRate || 0).toFixed(2) + '%';
                    }
                    if (pctEl) {
                        var wr = d.winRate || 0;
                        pctEl.innerText = wr >= 50 ? 'ABOVE AVG' : 'BELOW AVG';
                        pctEl.className = 'percentage ' + (wr >= 50 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'total-trades': {
                    var el = document.getElementById('tradesDisplay') || document.querySelector('.profit-value, .winrate-value, h1');
                    if (el) {
                        el.innerText = String(d.totalTrades || 0);
                    }
                    break;
                }
                case 'novatrix-score': {
                    var el = document.querySelector('.score-value, .profit-value, h1');
                    if (el) {
                        el.innerText = String(d.novatrixScore || 0);
                    }
                    break;
                }
                case 'equity-drawdown': {
                    var el = document.querySelector('.drawdown-value, .profit-value, h1');
                    if (el) {
                        var dd = d.maxDrawdown || 0;
                        el.innerText = dd.toFixed(2) + '%';
                    }
                    break;
                }
            }
        } catch(err) { /* silently ignore */ }
    });
    </script>
</body>
</html>
