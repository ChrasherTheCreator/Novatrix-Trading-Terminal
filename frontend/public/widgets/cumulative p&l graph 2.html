<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Topography Profit Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-purple: #a855f7;
            --phosphor-glow: rgba(168, 85, 247, 0.2);
            --grid-line: rgba(168, 85, 247, 0.08);
            --text-main: #f8fafc;
            --text-dim: #555555;
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        .obsidian-display {
            position: relative;
            width: 782px;
            height: 512px;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            animation: widgetEntry 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            container-type: inline-size;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        @keyframes widgetEntry {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .title-group h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-dim);
            font-weight: 700;
            margin-bottom: 8px;
            margin-top: -2px;
        }

        .title-group .total-value {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: -0.04em;
            background: linear-gradient(to bottom, #fff, #a855f7);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .graph-viewport {
            width: 100%;
            height: 512px;
            position: relative;
            cursor: crosshair;
            margin-top: 12px;
        }

        .svg-container {
            width: 100%;
            height: 100%;
            overflow: visible;

        }

        .data-path-fill {
            fill: url(#areaGradient);
            opacity: 0.3;
        }

        .data-path {
            fill: none;
            stroke: var(--phosphor-purple);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 12px var(--phosphor-glow));
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: drawPath 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes drawPath {
            to {
                stroke-dashoffset: 0;
            }
        }

        .hover-line {
            stroke: var(--phosphor-purple);
            stroke-width: 1;
            stroke-dasharray: 4 4;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .data-point-focus {
            fill: var(--obsidian-base);
            stroke: var(--phosphor-purple);
            stroke-width: 2;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .tooltip {
            position: absolute;
            pointer-events: none;
            background: var(--obsidian-surface);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--phosphor-glow);
            opacity: 0;
            transform: translate(-50%, -120%);
            z-index: 10;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .tooltip-date {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .tooltip-value {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }

        .y-axis,
        .x-axis {
            font-size: 14px;
            fill: var(--text-dim);
            user-select: none;
            font-weight: 300;
        }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }
</style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>

<body>

    <div class="obsidian-display">
        <div class="insufficient-data-overlay" id="noDataOverlay">
            <span>NEEDS MORE DATA</span>
            <p>Add trades to see stats</p>
        </div>

        <header class="header">
            <div class="title-group">
                <h2>Cumulative Profit</h2>
                <div class="total-value" id="totalDisplay">$142,840.00</div>
            </div>
            <div class="title-group">
                <h2>PERIOD: H1 2026</h2>
                <div style="color: #00ffaa">+12.4% vs. Last Year</div>
            </div>
        </header>

        <div class="graph-viewport" id="graphViewport">
            <div class="tooltip" id="tooltip">
                <div class="tooltip-date" id="ttDate">OCT 12</div>
                <div class="tooltip-value" id="ttValue">$12,400.00</div>
            </div>

            <svg class="svg-container" id="svgGraph" viewBox="0 0 1000 512" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--phosphor-purple)" stop-opacity="0.4" />
                        <stop offset="100%" stop-color="var(--phosphor-purple)" stop-opacity="0" />
                    </linearGradient>
                </defs>

                <g id="gridLayer"></g>
                <path class="data-path-fill" id="fillPath" d="" />
                <path class="data-path" id="mainPath" d="" />
                <line class="hover-line" id="hoverLine" x1="0" y1="0" x2="0" y2="380" />
                <circle class="data-point-focus" id="focusPoint" r="6" cx="-20" cy="-20" />
                <g class="y-axis" id="yAxisLabels"></g>
                <g class="x-axis" id="xAxisLabels"></g>
            </svg>
        </div>
    </div>

    <script>
        let chartData = [
            { date: 'SEP 01', value: 0 }
        ];

        const svg = document.getElementById('svgGraph');
        const mainPath = document.getElementById('mainPath');
        const fillPath = document.getElementById('fillPath');
        const gridLayer = document.getElementById('gridLayer');
        const yAxisLabels = document.getElementById('yAxisLabels');
        const xAxisLabels = document.getElementById('xAxisLabels');
        const viewport = document.getElementById('graphViewport');
        const hoverLine = document.getElementById('hoverLine');
        const focusPoint = document.getElementById('focusPoint');
        const tooltip = document.getElementById('tooltip');
        const totalDisplay = document.getElementById('totalDisplay');

        const width = 1000;
        const height = 512;
        const padding = { top: 20, right: 20, bottom: 50, left: 70 };
        let points = [];

        function getSmartStep(max, min) {
            const range = max - min;
            const rawStep = (range || 1000) / 5;
            const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
            const res = rawStep / magnitude;
            let step;
            if (res < 1.5) step = 1;
            else if (res < 3) step = 2;
            else if (res < 7) step = 5;
            else step = 10;
            return step * magnitude;
        }

        function renderChart() {
            // Clear existing
            gridLayer.innerHTML = '';
            yAxisLabels.innerHTML = '';
            xAxisLabels.innerHTML = '';

            const values = chartData.map(d => d.value);
            const rawMax = Math.max(...values, 100);
            const rawMin = Math.min(...values, 0);
            
            const stepSize = getSmartStep(rawMax, rawMin);
            const chartMax = Math.ceil(rawMax / stepSize) * stepSize;
            const chartMin = Math.floor(rawMin / stepSize) * stepSize;
            const chartRange = chartMax - chartMin || 1;

            // Generate Grid and Y Labels
            for (let v = chartMin; v <= chartMax; v += stepSize) {
                const yPos = height - (((v - chartMin) / chartRange) * (height - 60)) - 40;

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", padding.left);
                line.setAttribute("y1", yPos);
                line.setAttribute("x2", width);
                line.setAttribute("y2", yPos);
                line.setAttribute("stroke", "var(--grid-line)");
                gridLayer.appendChild(line);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", 0);
                text.setAttribute("y", yPos + 4);
                text.textContent = v >= 1000 || v <= -1000 ? `$${(v / 1000).toFixed(1)}K` : `$${v.toFixed(0)}`;
                yAxisLabels.appendChild(text);
            }

            // Generate Points
            points = chartData.map((d, i) => {
                const x = padding.left + (i * (width - padding.left) / (Math.max(chartData.length - 1, 1)));
                const y = height - (((d.value - chartMin) / chartRange) * (height - 60)) - 40;
                return { x, y, ...d };
            });

            const pathData = points.reduce((acc, p, i) =>
                acc + (i === 0 ? `M ${p.x} ${p.y}` : ` L ${p.x} ${p.y}`), "");

            mainPath.setAttribute("d", pathData);
            const zeroY = height - (((0 - chartMin) / chartRange) * (height - 60)) - 40;
            const fillData = pathData + ` L ${points[points.length - 1].x} ${zeroY} L ${points[0].x} ${zeroY} Z`;
            fillPath.setAttribute("d", fillData);

            // X Labels
            const step = Math.ceil(chartData.length / 6);
            chartData.forEach((d, i) => {
                if (i % step === 0 || i === chartData.length - 1) {
                    const x = padding.left + (i * (width - padding.left) / (Math.max(chartData.length - 1, 1)));
                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", x);
                    text.setAttribute("y", height - 10);
                    text.setAttribute("text-anchor", "middle");
                    text.textContent = d.date;
                    xAxisLabels.appendChild(text);
                }
            });
        }

        // Interaction
        viewport.addEventListener('mousemove', (e) => {
            if (!points.length) return;
            const rect = svg.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (width / rect.width);
            let closest = points[0];
            let minDiff = Math.abs(mouseX - points[0].x);
            points.forEach(p => {
                const diff = Math.abs(mouseX - p.x);
                if (diff < minDiff) { minDiff = diff; closest = p; }
            });

            hoverLine.setAttribute("x1", closest.x);
            hoverLine.setAttribute("x2", closest.x);
            hoverLine.style.opacity = "1";
            focusPoint.setAttribute("cx", closest.x);
            focusPoint.setAttribute("cy", closest.y);
            focusPoint.style.opacity = "1";
            tooltip.style.opacity = "1";
            tooltip.style.left = `${(closest.x / width) * 100}%`;
            tooltip.style.top = `${(closest.y / height) * 100}%`;
            document.getElementById('ttDate').textContent = closest.date;
            document.getElementById('ttValue').textContent = `$${closest.value.toLocaleString(undefined, {minimumFractionDigits:2})}`;
        });

        viewport.addEventListener('mouseleave', () => {
            hoverLine.style.opacity = "0"; focusPoint.style.opacity = "0"; tooltip.style.opacity = "0";
        });

        renderChart();
    </script>

    <!-- Creatix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'CREATIX_DATA') return;
        var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades < 2 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }

        
        // Update header values if it's the specific widget or if we just want global sync
        if (d.widgetId === 'cumulative-pnl' || d.totalPnl !== undefined) {
            var totalEl = document.getElementById('totalDisplay');
            if (totalEl) {
                totalEl.innerText = (d.totalPnl >= 0 ? '+' : '-') + '$' + Math.abs(d.totalPnl || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
            }
        }

        if (d.trades && d.trades.length > 0) {
            // Rebuild chart data from trades
            var sortedTrades = [...d.trades].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            var runningPnl = 0;
            var newChartData = [{ date: 'START', value: 0 }];
            
            sortedTrades.forEach(t => {
                runningPnl += (t.pnl || 0);
                var dateObj = new Date(t.created_at);
                var label = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                newChartData.push({ date: label, value: runningPnl });
            });
            
            chartData = newChartData;
            renderChart();
        }
    });
    </script>

</body>

</html>
