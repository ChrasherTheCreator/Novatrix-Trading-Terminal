<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;

            --phosphor-red: #ff3366;
            --gloss-purple: #793ce4;
            --text-primary: #ffffff;
            --text-muted: #555555;
            --bg-secondary: rgba(255, 255, 255, 0.03);
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-display {
            position: relative;
            width: 250px;
            height: 160px;
            padding: 20px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            container-type: inline-size;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            color: var(--text-primary);
        }

        /* Glanzeffekte */
        .obsidian-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(157, 78, 221, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .gloss-reflection {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }

        /* Progress Bar */
        .progress-container {
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, var(--gloss-purple), var(--phosphor-red));
            box-shadow: 0 0 10px rgba(0, 255, 163, 0.2);
        }

        /*.obsidian-display:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(157, 78, 221, 0.4);
        }*/

        /* Typography & Helper Classes */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .text-upper {
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }
</style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>

<body>

    <div class="obsidian-display">
        <div class="insufficient-data-overlay" id="noDataOverlay">
            <span>NEEDS MORE DATA</span>
            <p>Add trades to see stats</p>
        </div>

        <div class="gloss-reflection"></div>

        <div class="flex-between" style="margin-bottom: 1.25rem; position: relative; z-index: 2;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="var(--phosphor-red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
                    <path d="m9 11 3 3L22 4"></path>
                </svg>
                <span class="text-upper"
                    style="font-size: 0.75rem; font-weight: 800; color: var(--text-primary);">DRAWDOWN MONITOR</span>
            </div>
        </div>

        <div class="flex-between" style="margin-bottom: 0.75rem; font-size: 0.8125rem; position: relative; z-index: 2;">
            <span style="color: rgba(255,255,255,0.7);">Today's Drawdown</span>
            <span style="color: var(--phosphor-red); font-weight: 700; ">+$0</span>
        </div>

        <div style="position: relative; z-index: 2;">
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <div class="flex-between"
                style="font-size: 0.675rem; color: var(--text-muted); font-weight: 700;margin-top: 4px;">
                <span class="text-upper">Daily DD Usage</span>
                <span>0.0%</span>
            </div>
            <div class="flex-between"
                style="font-size: 0.675rem; color: var(--text-muted); font-weight: 700;margin-top: 4px;">
                <span class="text-upper">DAILY DD LIMIT</span>
                <span>$1,000</span>
            </div>
        </div>
    </div>


    <!-- Creatix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'CREATIX_DATA') return;
        var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades === 0 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }

        if (d.widgetId !== 'equity-drawdown') return;

        try {
            var dd = d.maxDrawdown || 0;
            // Assuming we want to show max drawdown as the primary value
            var ddValEl = document.querySelector('.flex-between span:nth-child(2)'); // Today's Drawdown (using as placeholder)
            var usagePctEl = document.querySelectorAll('.flex-between span')[3]; // Usage %
            var bar = document.querySelector('.progress-bar');

            if (ddValEl) {
                ddValEl.innerText = dd.toFixed(2) + '%';
            }
            if (usagePctEl) {
                usagePctEl.innerText = dd.toFixed(1) + '%';
            }
            if (bar) {
                // Assuming 10% is a "max" limit for the progress bar display
                var barWidth = Math.min((dd / 10) * 100, 100);
                bar.style.width = barWidth + '%';
            }
        } catch(err) { console.error('Error updating equity-drawdown widget:', err); }
    });
    </script>
</body>

</html>
