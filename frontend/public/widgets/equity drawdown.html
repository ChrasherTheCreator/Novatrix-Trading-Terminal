<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;

            --phosphor-red: #ff3366;
            --gloss-purple: #793ce4;
            --text-primary: #ffffff;
            --text-muted: #555555;
            --bg-secondary: rgba(255, 255, 255, 0.03);
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-display {
            position: relative;
            width: 250px;
            height: 160px;
            padding: 20px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            container-type: inline-size;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            color: var(--text-primary);
        }

        /* Glanzeffekte */
        .obsidian-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(157, 78, 221, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .gloss-reflection {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }

        /* Progress Bar */
        .progress-container {
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, var(--gloss-purple), var(--phosphor-red));
            box-shadow: 0 0 10px rgba(0, 255, 163, 0.2);
        }

        /*.obsidian-display:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(157, 78, 221, 0.4);
        }*/

        /* Typography & Helper Classes */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .text-upper {
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>

    <div class="obsidian-display">
        <div class="gloss-reflection"></div>

        <div class="flex-between" style="margin-bottom: 1.25rem; position: relative; z-index: 2;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="var(--phosphor-red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
                    <path d="m9 11 3 3L22 4"></path>
                </svg>
                <span class="text-upper"
                    style="font-size: 0.75rem; font-weight: 800; color: var(--text-primary);">DRAWDOWN MONITOR</span>
            </div>
        </div>

        <div class="flex-between" style="margin-bottom: 0.75rem; font-size: 0.8125rem; position: relative; z-index: 2;">
            <span style="color: rgba(255,255,255,0.7);">Today's Drawdown</span>
            <span style="color: var(--phosphor-red); font-weight: 700; ">+$0</span>
        </div>

        <div style="position: relative; z-index: 2;">
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <div class="flex-between"
                style="font-size: 0.675rem; color: var(--text-muted); font-weight: 700;margin-top: 4px;">
                <span class="text-upper">Daily DD Usage</span>
                <span>0.0%</span>
            </div>
            <div class="flex-between"
                style="font-size: 0.675rem; color: var(--text-muted); font-weight: 700;margin-top: 4px;">
                <span class="text-upper">DAILY DD LIMIT</span>
                <span>$1,000</span>
            </div>
        </div>
    </div>


    <!-- Novatrix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'NOVATRIX_DATA') return;
        var d = e.data;
        try {
            switch(d.widgetId) {
                case 'pnl-status': {
                    var el = document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var pnl = d.totalPnl || 0;
                        var isPos = pnl >= 0;
                        el.innerText = (isPos ? '+' : '-') + '

</html> + Math.abs(pnl).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        el.className = 'profit-value ' + (isPos ? 'is-positive' : 'is-negative');
                        if (typeof adjustFontSize === 'function') adjustFontSize();
                    }
                    if (pctEl && d.totalTrades > 0) {
                        var pct = ((d.totalPnl / 10000) * 100);
                        pctEl.innerText = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
                        pctEl.className = 'percentage ' + (pct >= 0 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'profit-factor': {
                    var el = document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var pf = d.profitFactor || 0;
                        el.innerText = pf.toFixed(2);
                        el.className = 'profit-value ' + (pf >= 1 ? 'is-positive' : 'is-negative');
                    }
                    if (pctEl) {
                        pctEl.innerText = pf >= 1.5 ? 'STRONG' : pf >= 1 ? 'FAIR' : 'WEAK';
                        pctEl.className = 'percentage ' + (pf >= 1 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'sharpe-ratio': {
                    var el = document.getElementById('sharpeDisplay') || document.getElementById('profitDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        var sr = d.sharpeRatio || 0;
                        el.innerText = sr.toFixed(2);
                        el.className = el.className.replace(/is-\w+/g, '') + (sr >= 1 ? ' is-positive' : sr >= 0 ? '' : ' is-negative');
                    }
                    if (pctEl) {
                        pctEl.innerText = sr >= 2 ? 'EXCELLENT' : sr >= 1 ? 'GOOD' : sr >= 0 ? 'FAIR' : 'POOR';
                        pctEl.className = 'percentage ' + (sr >= 1 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'winrate': {
                    var el = document.getElementById('winrateDisplay');
                    var pctEl = document.getElementById('percentageDisplay');
                    if (el) {
                        el.innerText = (d.winRate || 0).toFixed(2) + '%';
                    }
                    if (pctEl) {
                        var wr = d.winRate || 0;
                        pctEl.innerText = wr >= 50 ? 'ABOVE AVG' : 'BELOW AVG';
                        pctEl.className = 'percentage ' + (wr >= 50 ? 'is-positive' : 'is-negative');
                    }
                    break;
                }
                case 'total-trades': {
                    var el = document.getElementById('tradesDisplay') || document.querySelector('.profit-value, .winrate-value, h1');
                    if (el) {
                        el.innerText = String(d.totalTrades || 0);
                    }
                    break;
                }
                case 'novatrix-score': {
                    var el = document.querySelector('.score-value, .profit-value, h1');
                    if (el) {
                        el.innerText = String(d.novatrixScore || 0);
                    }
                    break;
                }
                case 'equity-drawdown': {
                    var el = document.querySelector('.drawdown-value, .profit-value, h1');
                    if (el) {
                        var dd = d.maxDrawdown || 0;
                        el.innerText = dd.toFixed(2) + '%';
                    }
                    break;
                }
            }
        } catch(err) { /* silently ignore */ }
    });
    </script>
</body>

</html>
