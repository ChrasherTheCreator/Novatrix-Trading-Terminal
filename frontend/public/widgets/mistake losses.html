<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-purple: #a855f7;
            --phosphor-red: #ff3366;
            --text-primary: #ffffff;
            --text-muted: #555555;
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-display {
            position: relative;
            width: 516px;
            height: 336px;
            padding: 32px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--phosphor-purple);
            font-weight: 800;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .label::after {
            content: '';
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--border-subtle), transparent);
        }

        .mistake-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .mistake-card {
            position: relative;
        }

        .mistake-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .mistake-name {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .mistake-value {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        .percentage-tag {
            font-size: 0.7rem;
            color: var(--phosphor-red);
            font-weight: 800;
            background: rgba(255, 51, 102, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .progress-bg {
            height: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 2px;
        }

        .progress-fill {
            height: 100%;
            background: var(--phosphor-red);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
            border-radius: 2px;
        }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }
</style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>
<body>

    <div class="obsidian-display">
        <div class="insufficient-data-overlay" id="noDataOverlay">
            <span>NEEDS MORE DATA</span>
            <p>Add trades to see stats</p>
        </div>

        <div class="label">
            <span class="material-symbols-outlined" style="font-size: 16px;">error</span>
            Mistake Analysis
        </div>

        <div class="mistake-list">
            <div class="mistake-card">
                <div class="mistake-info">
                    <div>
                        <div class="mistake-name">FOMO</div>
                        <div class="mistake-value">-$1,424</div>
                    </div>
                    <span class="percentage-tag">71.2%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" style="width: 71.2%;"></div>
                </div>
            </div>

            <div class="mistake-card">
                <div class="mistake-info">
                    <div>
                        <div class="mistake-name">Revenge Trading</div>
                        <div class="mistake-value">-$500</div>
                    </div>
                    <span class="percentage-tag">25.0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" style="width: 25%;"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- Novatrix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'NOVATRIX_DATA') return;
        var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades === 0 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }

        if (d.widgetId !== 'mistake-losses') return;

        try {
            var trades = d.trades || [];
            var mistakeMap = {};
            var totalMistakeLoss = 0;

            trades.forEach(function(t) {
                if (t.mistake_tags && Array.isArray(t.mistake_tags)) {
                    t.mistake_tags.forEach(function(tag) {
                        if (t.pnl < 0) {
                            mistakeMap[tag] = (mistakeMap[tag] || 0) + Math.abs(t.pnl);
                            totalMistakeLoss += Math.abs(t.pnl);
                        }
                    });
                }
            });

            var sortedMistakes = Object.keys(mistakeMap).map(function(tag) {
                return { name: tag, value: mistakeMap[tag] };
            }).sort(function(a, b) { return b.value - a.value; }).slice(0, 3);

            var listEl = document.querySelector('.mistake-list');
            if (listEl) {
                listEl.innerHTML = '';
                sortedMistakes.forEach(function(m) {
                    var pct = totalMistakeLoss > 0 ? (m.value / totalMistakeLoss * 100) : 0;
                    var card = document.createElement('div');
                    card.className = 'mistake-card';
                    card.innerHTML = 
                        '<div class="mistake-info">' +
                            '<div>' +
                                '<div class="mistake-name">' + m.name + '</div>' +
                                '<div class="mistake-value">-$' + m.value.toLocaleString(undefined, {maximumFractionDigits: 0}) + '</div>' +
                            '</div>' +
                            '<span class="percentage-tag">' + pct.toFixed(1) + '%</span>' +
                        '</div>' +
                        '<div class="progress-bg">' +
                            '<div class="progress-fill" style="width: ' + pct + '%;"></div>' +
                        '</div>';
                    listEl.appendChild(card);
                });
                
                if (sortedMistakes.length === 0) {
                    listEl.innerHTML = '<div style="color: var(--text-muted); text-align: center; margin-top: 40px;">No mistake data available</div>';
                }
            }
        } catch(err) { console.error('Error updating mistake-losses widget:', err); }
    });
    </script>
</body>
</html>
