<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=payments" />
    <style>
        :root {
            --obsidian-base: #050507;
            --phosphor-green: #00ffa3;
            --phosphor-red: #ff3366;
            --gloss-purple: #a855f7;
            --surface-shine: rgba(255, 255, 255, 0.03);
            --phosphor-glow-green: rgba(0, 255, 163, 0.15);
            --phosphor-glow-red: rgba(255, 51, 102, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-display {
            position: relative;
            width: 250px;
            height: 160px;
            padding: 24px 20px;
            background: linear-gradient(145deg, #0f0f12 0%, #050507 100%);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            border: 1px solid rgba(157, 78, 221, 0.15);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);

            container-type: inline-size;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .obsidian-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(157, 78, 221, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gloss-purple);
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.8;
        }

        .label::after {
            content: '';
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, rgba(157, 78, 221, 0.3), transparent);
        }

        .value-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .profit-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            margin: 0;
            white-space: nowrap;
            display: inline-block;
            max-width: 100%;
            text-align: center;
            margin-bottom: 16px;
        }

        .is-positive {
            text-align: center;
            color: var(--phosphor-green);
            text-shadow: 0 0 15px var(--phosphor-glow-green), 0 0 30px var(--phosphor-glow-green);
        }

        .is-negative {
            text-align: center;
            color: var(--phosphor-red);
            text-shadow: 0 0 15px var(--phosphor-glow-red), 0 0 30px var(--phosphor-glow-red);
        }

        .meta-data {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .percentage {
            font-size: clamp(10px, 8cqw, 16px);
            font-weight: 600;
        }

        .timeframe {
            font-size: 12px;
            color: #555;
            font-weight: 300;
            line-height: 1;
        }

        /* Hover Interaction */
        .obsidian-display:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(157, 78, 221, 0.4);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(157, 78, 221, 0.1);
        }

        /* Entry Animation */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-reveal {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .gloss-reflection {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }
</style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>
<body>

    <div class="obsidian-display animate-reveal" id="profitWidget" onclick="toggleState()">
        <div class="insufficient-data-overlay" id="noDataOverlay">
            <span>NEEDS MORE DATA</span>
            <p>Add trades to see stats</p>
        </div>

        <div class="phosphor-layer"></div>
        <div class="gloss-reflection"></div>
        
        <div class="label">
            <span class="material-symbols-outlined" 
                style="font-size: 18px; color: var(--gloss-purple);">
                payments
            </span>
            Profit Factor
        </div>
        
        <div class="value-container">
            <h1 id="profitDisplay" class="profit-value is-positive">4.14</h1>
        </div>

        <div class="meta-data">
            <div id="percentageDisplay" class="percentage is-positive">+14.2%</div>
            <div class="timeframe">ALL TIME</div>
        </div>
    </div>

    <script>
        let isPositive = true;
        const profitDisplay = document.getElementById('profitDisplay');
        const percentageDisplay = document.getElementById('percentageDisplay');
        const widget = document.getElementById('profitWidget');

        function toggleState() {
            isPositive = !isPositive;
            
            if (isPositive) {
                profitDisplay.innerText = "4.14";
                profitDisplay.className = "profit-value is-positive";
                percentageDisplay.innerText = "+14.2%";
                percentageDisplay.className = "percentage is-positive";
            } else {
                profitDisplay.innerText = "0.78";
                profitDisplay.className = "profit-value is-negative";
                percentageDisplay.innerText = "-3.8%";
                percentageDisplay.className = "percentage is-negative";
            }

            // Trigger haptic feel via quick scale
            widget.style.transform = 'scale(0.95)';
            setTimeout(() => {
                widget.style.transform = '';
            }, 100);
        }
    </script>

    <!-- Novatrix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'NOVATRIX_DATA') return;
        var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades === 0 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }

        if (d.widgetId !== 'profit-factor') return;

        try {
            var el = document.getElementById('profitDisplay');
            var pctEl = document.getElementById('percentageDisplay');
            if (el) {
                var pf = d.profitFactor || 0;
                el.innerText = pf.toFixed(2);
                el.className = 'profit-value ' + (pf >= 1 ? 'is-positive' : 'is-negative');
            }
            if (pctEl) {
                var pf = d.profitFactor || 0;
                pctEl.innerText = pf >= 1.5 ? 'STRONG' : pf >= 1 ? 'FAIR' : 'WEAK';
                pctEl.className = 'percentage ' + (pf >= 1 ? 'is-positive' : 'is-negative');
            }
        } catch(err) { console.error('Error updating profit-factor widget:', err); }
    });
    </script>
</body>
</html>
