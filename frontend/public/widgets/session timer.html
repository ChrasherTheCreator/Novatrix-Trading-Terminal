<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-green: #00ffa3;
            --gloss-purple: #a855f7;
            --text-primary: #ffffff;
            --text-muted: #555555;
            --bg-secondary: rgba(255, 255, 255, 0.03);
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .obsidian-display {
            position: relative;
            width: 250px;
            height: 160px;
            padding: 20px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);

            container-type: inline-size;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .obsidian-display::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(157, 78, 221, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .gloss-reflection {
            position: absolute;
            top: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
        }

        .label-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Main Time Value [cite: 6, 32] */
        .timer-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 950;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1;
            margin: 8px 0;
            position: relative;
            z-index: 1;
        }

        .footer-badge {
            margin-top: 8px;
            display: flex;
            justify-content: center;
        }

        .badge-content {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--phosphor-green);
            box-shadow: 0 0 8px var(--phosphor-green);
        }

        .location-text {
            font-size: 11px;
            font-weight: 800;
            color: white;
        }

        .time-utc {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .obsidian-display:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(157, 78, 221, 0.4);
        }

        .animate-reveal {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }
</style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>
<body>

    <div class="obsidian-display animate-reveal">
        <div class="insufficient-data-overlay" id="noDataOverlay">
            <span>NEEDS MORE DATA</span>
            <p>Add trades to see stats</p>
        </div>

        <div class="gloss-reflection"></div>
        
        <div class="header">
            <div class="label-group">
                <span class="material-symbols-outlined" style="font-size: 18px; color: var(--gloss-purple);">timer</span>
                <span class="session-label">New York Open</span>
            </div>
            <span class="material-symbols-outlined" style="font-size: 16px; color: var(--text-muted);">language</span>
        </div>

        <div class="timer-value">00:23:23</div>

        <div class="footer-badge">
            <div class="badge-content">
                <div class="status-dot"></div>
                <span class="location-text">SYDNEY</span>
                <span class="material-symbols-outlined" style="font-size: 14px; color: var(--text-muted);">arrow_forward</span>
                <span class="time-utc">20:00 UTC</span>
            </div>
        </div>
    </div>
    

    <script>
        function updateTimer() {
            const now = new Date();
            const sessions = [
                { name: 'Tokyo Open', hour: 0 },
                { name: 'London Open', hour: 8 },
                { name: 'New York Open', hour: 13 },
                { name: 'Tokyo Open', hour: 24 } // Next day Tokyo
            ];

            const currentHour = now.getUTCHours();
            const currentMin = now.getUTCMinutes();
            const currentSec = now.getUTCSeconds();
            
            let next = sessions.find(s => s.hour > currentHour);
            if (!next) next = sessions[0];

            let diffHours = next.hour - currentHour - 1;
            let diffMins = 59 - currentMin;
            let diffSecs = 59 - currentSec;

            if (diffHours < 0) diffHours += 24;

            const timeStr = 
                String(diffHours).padStart(2, '0') + ':' + 
                String(diffMins).padStart(2, '0') + ':' + 
                String(diffSecs).padStart(2, '0');

            document.querySelector('.timer-value').textContent = timeStr;
            document.querySelector('.session-label').textContent = next.name;
            
            // Location Badge
            const loc = next.name.split(' ')[0].toUpperCase();
            document.querySelector('.location-text').textContent = loc;
            document.querySelector('.time-utc').textContent = next.hour + ':00 UTC';
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>

    <!-- Creatix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'CREATIX_DATA') return;
        var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades === 0 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }
        // The timer doesn't need specific trade data but we handle the message to stay compatible
    });
    </script>

</body>
</html>
