<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700;950&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --obsidian-base: #050507;
            --obsidian-surface: #0f0f12;
            --phosphor-purple: #a855f7;
            --phosphor-glow: rgba(168, 85, 247, 0.2);
            --text-primary: #ffffff;
            --text-muted: #555555;
            --border-subtle: rgba(157, 78, 221, 0.15);
        }

        body {
            background-color: var(--obsidian-base);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .novatrix-card {
            position: relative;
            width: 250px;
            height: 160px;
            padding: 20px;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-base) 100%);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            container-type: inline-size;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .novatrix-card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 120px;
            height: 120px;
            background: var(--phosphor-purple);
            filter: blur(50px);
            opacity: 0.15;
            pointer-events: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            margin-top: -4px;
        }

        .card-header h3 {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            margin: 0;
        }

        .index-main {
            text-align: center;
            margin-bottom: 28px;
        }

        .index-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text-primary);
        }

        .index-max {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-left: 4px;
        }

        .index-label {
            margin-top: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--phosphor-purple);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Progress Bar */
        .progress-container {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: -12px;
            margin-bottom: -8px;
        }

        .progress-bar {
            width: 81%;
            height: 100%;
            background: var(--phosphor-purple);
            box-shadow: 0 0 15px var(--phosphor-glow);
            border-radius: 10px;
            transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    
        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple, #a855f7);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }
</style>
<style> 
  body { 
      background: transparent !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      overflow: hidden !important;
  }
  body > div { 
      width: 100% !important; 
      height: 100% !important; 
      margin: 0 !important; 
      box-sizing: border-box !important; 
  }
</style>
</head>

<body>

    <div class="novatrix-card">
        <div class="card-header">
            <h3>NOVATRIX INDEX</h3>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="var(--phosphor-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z">
                </path>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
        </div>

        <div class="index-main">
            <div class="index-value">
                81<span class="index-max">/ 100</span>
            </div>
            <div class="index-label">Professional Edge</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>


    <!-- Novatrix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'NOVATRIX_DATA') return;
        var d = e.data;
        var overlay = document.getElementById('noDataOverlay');
        if (overlay) {
            var showOverlay = d.totalTrades === 0 && !d.demoMode;
            overlay.style.display = showOverlay ? 'flex' : 'none';
        }

        if (d.widgetId !== 'novatrix-score') return;

        try {
            var score = d.novatrixScore || 0;
            var el = document.querySelector('.index-value');
            var bar = document.querySelector('.progress-bar');

            if (el) {
                el.innerHTML = Math.round(score) + '<span class="index-max">/ 100</span>';
            }
            if (bar) {
                bar.style.width = score + '%';
            }
        } catch(err) { console.error('Error updating novatrix-score widget:', err); }
    });
    </script>
</body>

</html>
