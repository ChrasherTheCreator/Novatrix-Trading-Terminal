<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=percent" />
    <style>
        :root {
            --obsidian-base: #050507;
            --phosphor-green: #00ffa3;
            --phosphor-red: #ff3366;
            --gloss-purple: #a855f7;
            --surface-shine: rgba(255, 255, 255, 0.03);
            --phosphor-glow-green: rgba(0, 255, 163, 0.15);
            --phosphor-glow-red: rgba(255, 51, 102, 0.15);
            --text-primary: #ffffff;
            --text-muted: #555555;
        }

        .light-mode {
            --text-primary: #020617;
            --text-muted: #64748b;
            --phosphor-green: #059669;
            --phosphor-red: #dc2626;
            --phosphor-glow-green: rgba(5, 150, 105, 0.1);
            --phosphor-glow-red: rgba(220, 38, 38, 0.1);
        }

        body {
            background-color: transparent !important;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .obsidian-display {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 24px 20px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);

            container-type: inline-size;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .insufficient-data-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        .insufficient-data-overlay span {
            font-size: 10px;
            font-weight: 800;
            color: var(--gloss-purple);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .insufficient-data-overlay p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }

        .obsidian-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(157, 78, 221, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gloss-purple);
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.8;
        }

        .label::after {
            content: '';
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, rgba(157, 78, 221, 0.3), transparent);
        }

        .value-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .winrate-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            margin: 0;
            transition: all 0.5s ease;
            color:rgba(177, 104, 236, 0.781);
            display: inline-block;
            max-width: 100%;
            text-align: center;
            margin-bottom: 16px;
        }

        .is-positive {
            text-align: center;
            color: var(--phosphor-green);
            text-shadow: 0 0 15px var(--phosphor-glow-green), 0 0 30px var(--phosphor-glow-green);
        }

        .is-negative {
            text-align: center;
            color: var(--phosphor-red);
            text-shadow: 0 0 15px var(--phosphor-glow-red), 0 0 30px var(--phosphor-glow-red);
        }

        .meta-data {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .percentage {
            font-size: clamp(10px, 8cqw, 16px);
            font-weight: 600;
        }

        .timeframe {
            font-size: 12px;
            color: #555;
            font-weight: 300;
            line-height: 1;
        }

        /* Hover Interaction */
        .obsidian-display:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(157, 78, 221, 0.4);
            box-shadow: none !important;
        }

        .gloss-reflection {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }
    
        /* Automatic Light Mode styling */
        .light-mode {
            --obsidian-base: #f8fafc;
            --obsidian-surface: #ffffff;
            --text-primary: #020617;
            --text-main: #020617;
            --text-dim: #64748b;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-subtle: rgba(139, 92, 246, 0.15);
            --surface-shine: rgba(0, 0, 0, 0.02);
            --grid-line: rgba(139, 92, 246, 0.08);
            --glow-accent: rgba(139, 92, 246, 0.05);
            --phosphor-green: #059669;
            --phosphor-red: #dc2626;
            --phosphor-glow-green: rgba(5, 150, 105, 0.1);
            --phosphor-glow-red: rgba(220, 38, 38, 0.1);
            --gloss-purple: #7c3aed;
        }
        .light-mode body {
            color: var(--text-primary) !important;
        }
        .light-mode .obsidian-display,
        .light-mode .creatix-card,
        .light-mode .card,
        .light-mode .widget-container,
        .light-mode .display-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        .light-mode svg text {
            fill: var(--text-dim) !important;
        }
        .light-mode .timeframe {
            color: var(--text-muted) !important;
        }
        .light-mode .label {
            color: var(--gloss-purple) !important;
        }
        .light-mode .stat-value.purple {
            color: var(--gloss-purple) !important;
        }
</style>
</head>
<body>

    <div class="obsidian-display" id="winrateWidget">
        <div class="insufficient-data-overlay" id="noDataOverlay">
            <span>NEEDS MORE DATA</span>
            <p>Add trades to see stats</p>
        </div>
        
        <div class="gloss-reflection"></div>
        
        <div class="label">
            <span class="material-symbols-outlined" 
                style="font-size: 18px; color: var(--gloss-purple);">
                percent
            </span>
            Win Rate
        </div>
        
        <div class="value-container">
            <h1 id="winrateDisplay" class="winrate-value">--%</h1>
        </div>

        <div class="meta-data">
            <div id="percentageDisplay" class="percentage">--</div>
            <div class="timeframe">ALL TIME</div>
        </div>
    </div>

    <!-- Creatix Data Bridge -->
    <script>
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'CREATIX_DATA') return;
        var d = e.data;
        
        var overlay = document.getElementById('noDataOverlay');
        if (d.totalTrades === 0 && !d.demoMode) {
            if (overlay) overlay.style.display = 'flex';
        } else {
            if (overlay) overlay.style.display = 'none';
        }

        if (d.widgetId !== 'winrate') return;

        try {
            var el = document.getElementById('winrateDisplay');
            var pctEl = document.getElementById('percentageDisplay');
            if (el) {
                var wr = d.winRate || 0;
                el.innerText = wr.toFixed(2) + '%';
            }
            if (pctEl) {
                var wr = d.winRate || 0;
                pctEl.innerText = wr >= 50 ? 'ABOVE AVG' : 'BELOW AVG';
                pctEl.className = 'percentage ' + (wr >= 50 ? 'is-positive' : 'is-negative');
            }
        } catch(err) { console.error('Error updating winrate widget:', err); }
    });
    </script>
</body>
</html>
